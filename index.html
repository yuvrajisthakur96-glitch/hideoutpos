let kotActionInFlight=false;
async function sendKOT(button=null){
 if(kotActionInFlight) return toast('KOT is already being sent');
 if(!firebaseReady()) return;
 if(!state.cart.length) return toast('Add items first');
 kotActionInFlight=true;
 if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Sending…'}
 try{
  const customerName=sanitizeText(state.pendingCustomer?.name||document.getElementById('custName')?.value||'Walk-in',60)||'Walk-in';
  const customerMobile=String(state.pendingCustomer?.mobile||document.getElementById('custMobile')?.value||'').replace(/\D/g,'').slice(0,10);
  const table=state.orderType==='DINE-IN'?sanitizeText(state.selectedTable,32):'—';
  const tableNumber=table==='—'?'':(table.match(/\d+/)?.[0]||'');
  const kotRef=fs.doc(fs.collection(db,'kots'));
  const sequenceRef=fs.doc(db,'settings','main');
  const items=state.cart.map(item=>({id:String(item.id||''),name:sanitizeText(item.name||'Item',100),qty:Math.max(1,Math.floor(Number(item.qty)||1)),note:sanitizeText(item.note||'',200)}));
  let kotRecord=null;
  await fs.runTransaction(db,async transaction=>{
   const sequenceSnapshot=await transaction.get(sequenceRef);
   const sequenceData=sequenceSnapshot.exists()?(sequenceSnapshot.data()||{}):{};
   const existingKotRecords=[...(state.kots||[]),...(state.orders||[]).map(order=>({code:order.kotCode}))];
   const sequence=nextSequenceValue('kotSequence','KOT-',102,sequenceData,existingKotRecords);
   const kotCode=formatKotCode(sequence);
   kotRecord={code:kotCode,kotCode,order:nextBillCode(),table,tableName:table,tableNumber,customerName,customerMobile,specialNotes:sanitizeText(state.pendingCustomer?.specialNotes||'',200),type:state.orderType,items,status:'New',source:'pos',autoPrint:false,printStatus:'pending',time:new Date().toLocaleTimeString('en-IN'),date:new Date().toLocaleDateString('en-IN'),createdAt:fs.serverTimestamp()};
   transaction.set(sequenceRef,{kotSequence:sequence},{merge:true});
   transaction.set(kotRef,kotRecord);
  });
  toast('KOT saved to Kitchen Display');
  go('kitchen');
 }catch(error){
  console.error('Send KOT failed:',error);
  toast('KOT could not be saved. Check the database connection and try again.');
 }finally{
  kotActionInFlight=false;
  if(button&&button.isConnected){button.disabled=false;button.textContent=button.dataset.originalText||'Send KOT'}
 }
}
// Builds the kitchen-ticket HTML for a given order/KOT source.
// Shared by the manual "Print KOT" button (printKOT, opens a real window —
// needs a user click) and the silent auto-print path for online orders
// (autoPrintKOTSilently, prints through a hidden iframe so it isn't blocked
// as a popup since it has no click behind it).
function buildKotTicketHTML(source, forAutoPrint){
  const ticketItems=Array.isArray(source.items)?source.items.filter(item=>item && Number(item.qty||0)>0):[];
  if(!ticketItems.length) return null;

  const configuredWidth=Number(state.settings?.kotWidth||58);
  const width=[58,79].includes(configuredWidth)?configuredWidth:79;
  const sourceCode=String(source.code||'');
  const isKotRecord=/^KOT-\d+$/i.test(sourceCode);
  const kotCode=String(source.kotCode || (isKotRecord?sourceCode:'') || nextKotCode());
  const kotNumber=kotCode.replace(/^KOT-/i,'');
  const orderCode=String(source.order || (!isKotRecord?sourceCode:'')).trim();
  const orderType=source.reorder || String(source.type||'').toUpperCase()==='REORDER'
    ? 'REORDER'
    : String(source.type || (source.table && source.table!=='—'?'DINE-IN':'ORDER')).toUpperCase();
  const displayType={
    'DINE-IN':'DINE-IN',
    'TAKEAWAY':'TAKEAWAY',
    'DELIVERY':'DELIVERY',
    'REORDER':'REORDER',
    'ORDER':'ORDER'
  }[orderType] || 'ORDER';
  const table= sanitizeText(source.tableName||source.table||'—',32)||'—';
  const tableNumber=sanitizeText(source.tableNumber||table.match(/\d+/)?.[0]||'',12);
  const customerName=sanitizeText(source.customerName||'Walk-in',60)||'Walk-in';
  const specialNotes=sanitizeText(source.specialNotes||'',200);
  const date=String(source.date||new Date().toLocaleDateString('en-GB'));
  const time=String(source.time||new Date().toLocaleTimeString());
  const items=ticketItems.map(item=>{
    const name=esc(item.name||'Unnamed item');
    const quantity=Math.max(0,Number(item.qty)||0);
    const note=String(item.note||'').trim();
    const noteHtml=note?`<div class="note"><b>NOTE:</b> ${esc(note).replace(/\r?\n/g,'<br>')}</div>`:'';

  }

}

function printKOT(customOrder=null,targetWindow=null){
  const table=state.orderType==='DINE-IN'?sanitizeText(state.selectedTable,32):'—';
  const source=customOrder || {
    items:state.cart,
    code:nextBillCode(),
    kotCode:nextKotCode(),
    type:state.orderType,
    table,tableName:table,
    tableNumber:table==='—'?'':(table.match(/\d+/)?.[0]||''),
    customerName:sanitizeText(state.pendingCustomer?.name||document.getElementById('custName')?.value||'',60),
    time:new Date().toLocaleTimeString('en-IN')
  };
  const built=buildKotTicketHTML(source,false);
  if(!built) return toast('Add items first');
  if(fhBtCharacteristic&&fhBtDevice?.gatt?.connected){if(targetWindow&&!targetWindow.closed)try{targetWindow.close()}catch(_){};printBluetoothKOT(source);return true;}
  const w=targetWindow||window.open('','_blank','width=420,height=760');
  if(!w){
    const fallbackSource={...source,id:''};
    if(autoPrintKOTSilently(fallbackSource)) return toast('KOT sent to the thermal printer');
    return toast('Allow pop-ups to print KOT');
  }
  w.document.open();w.document.write(built.html);w.document.close();
  return true;
}
// Silent auto-print — used for online/QR orders. There's no click behind
// this call (it fires from a Firestore listener), so window.open() would be
// blocked as a popup by the browser. Instead we reuse one hidden <iframe>
// that's already part of the page and print through that, which browsers
// allow without a user gesture.
let autoPrintFrame=null;
function getAutoPrintFrame(){
  if(autoPrintFrame && document.body.contains(autoPrintFrame)) return autoPrintFrame;
  const f=document.createElement('iframe');
  f.id='kotAutoPrintFrame';
  f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(f);
  autoPrintFrame=f;
  return f;
}
function autoPrintKOTSilently(source){
  const kotId=String(source?.id||'').trim();
  if(fhBtCharacteristic&&fhBtDevice?.gatt?.connected){
    if(kotId&&autoPrintKotsDispatched.has(kotId))return true;
    printBluetoothKOT(source).then(async ok=>{
      if(ok&&kotId)autoPrintKotsDispatched.add(kotId);
      const token=String(source?._printClaimToken||'');
      if(kotId&&token&&firebaseReady()){
        try{await fs.runTransaction(db,async transaction=>{
          const ref=fs.doc(db,'kots',kotId),snap=await transaction.get(ref);
          if(!snap.exists())return;
          const current=snap.data()||{};
          if(current.printStatus!=='printing'||current.printClaimToken!==token)return;
          transaction.update(ref,{printStatus:ok?'printed':'failed',...(ok?{printedAt:fs.serverTimestamp()}:{printError:'Bluetooth write failed',printFailedAt:fs.serverTimestamp()}),printClaimedAt:null,printClaimedBy:null,printClaimToken:null});
        });}catch(updateError){console.error('Bluetooth KOT print status update failed:',updateError);}
      }
    });
    return true;
  }
  // Do not dispatch the same physical ticket twice from this browser tab.
  if(kotId && autoPrintKotsDispatched.has(kotId)) return true;
  const built=buildKotTicketHTML(source,true);
  if(!built) return false;
  try{
    const f=getAutoPrintFrame();
    const doc=f.contentWindow.document;
    doc.open();
    doc.write(built.html);
    doc.close();
    if(kotId) autoPrintKotsDispatched.add(kotId);
    return true;
  }catch(error){
    console.error('Could not dispatch KOT to the print frame:',error);
    return false;
  }
}
function createKotPrintClaimToken(){
  try{if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();}catch(_){ }
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${String(firebaseDeviceUid||'pos').slice(-8)}`;
}
async function claimOnlineKOTForPrint(kotId){
  if(!firebaseReady()) return null;
  const ref=fs.doc(db,'kots',kotId);
  const claimToken=createKotPrintClaimToken();
  try{
    return await fs.runTransaction(db,async transaction=>{
      const snap=await transaction.get(ref);
      if(!snap.exists()) return null;
      const data=snap.data()||{};
      // The transaction is the cross-tab/cross-device lock. Only the first
      // POS terminal may move this exact Digital Menu KOT from pending to
      // printing. A claimed ticket is never automatically reclaimed.
      if(data.source!=='online-menu' || data.autoPrint!==true || data.printStatus!=='pending') return null;
      transaction.update(ref,{
        printStatus:'printing',
        printClaimToken:claimToken,
        printClaimedAt:fs.serverTimestamp(),
        printClaimedBy:auth?.currentUser?.uid||firebaseDeviceUid||'pos-staff'
      });
      return claimToken;
    });
  }catch(error){console.error('Could not claim online KOT for printing:',error);return null;}
}

async function processOnlineKOTPrint(kot){
  if(!state.autoPrintOnlineKots || !kot?.id || autoPrintKotsInFlight.has(kot.id) || autoPrintKotsDispatched.has(kot.id)) return;
  autoPrintKotsInFlight.add(kot.id);
  let claimToken=null;
  try{
    claimToken=await claimOnlineKOTForPrint(kot.id);
    if(!claimToken) return;
    const dispatched=autoPrintKOTSilently({...kot,id:kot.id,_printClaimToken:claimToken,kotCode:kot.kotCode||kot.code,order:kot.order});
    if(!dispatched){
      // Do not put an ambiguously claimed job back in the pending queue.
      // Staff can use the explicit Print action for a failed dispatch; an
      // automatic retry here could create a second physical ticket.
      await fs.updateDoc(fs.doc(db,'kots',kot.id),{
        printStatus:'failed',printError:'Could not load the thermal print frame.',
        printFailedAt:fs.serverTimestamp(),printClaimedAt:null,printClaimedBy:null,printClaimToken:null
      });
      toast(`KOT ${kot.kotCode||kot.code||''} could not be sent to printer. Use manual Print.`);
      return;
    }
    toast(`🔔 Online order ${kot.order||''} — one KOT sent to printer`);
  }catch(error){
    console.error('Online KOT auto-print error:',error);
    // Never reset to pending after a claim: the browser may already have
    // dispatched the print job before the error was observed.
    if(claimToken){
      try{await fs.updateDoc(fs.doc(db,'kots',kot.id),{
        printStatus:'failed',printError:String(error?.message||error).slice(0,180),
        printFailedAt:fs.serverTimestamp(),printClaimedAt:null,printClaimedBy:null,printClaimToken:null
      });}catch(updateError){console.error('Could not mark KOT print as failed:',updateError);}
    }
  }finally{
    autoPrintKotsInFlight.delete(kot.id);
  }
}

function schedulePendingOnlineKOTPrints(){
  if(!state.autoPrintOnlineKots || !db || !fs || firebaseStatus!=='connected') return;
  (state.kots||[]).forEach(k=>{
    if(k.source==='online-menu' && k.autoPrint===true && String(k.printStatus||'')==='pending'){
      processOnlineKOTPrint(k);
    }
  });
}

// Re-check only unclaimed pending jobs. Firestore's transaction ensures that
// repeated snapshots and timer ticks cannot dispatch the same KOT twice.
let onlineKOTPrintRetryTimer=null;
function startOnlineKOTPrintRetry(){
  if(onlineKOTPrintRetryTimer) return;
  onlineKOTPrintRetryTimer=setInterval(schedulePendingOnlineKOTPrints,15000);
}

window.addEventListener('message',event=>{
  const data=event.data||{};
  // Accept completion only from this POS page's hidden print iframe. The
  // claim token prevents a stale/forged message from completing another job.
  if(event.source!==autoPrintFrame?.contentWindow || data.type!=='FH_KOT_PRINT_FINISHED' || !data.id || !data.token || !firebaseReady()) return;
  const ref=fs.doc(db,'kots',String(data.id));
  fs.runTransaction(db,async transaction=>{
    const snap=await transaction.get(ref);
    if(!snap.exists()) return;
    const current=snap.data()||{};
    if(current.printStatus!=='printing' || current.printClaimToken!==String(data.token)) return;
    transaction.update(ref,{
      printStatus:'printed',
      printedAt:fs.serverTimestamp(),
      printClaimedAt:null,
      printClaimedBy:null,
      printClaimToken:null
    });
  }).catch(error=>console.error('Could not record KOT print completion:',error));
});

let receiptPrintFrame=null;
function printReceipt(order,customer,targetWindow){
  if(fhBtCharacteristic&&fhBtDevice?.gatt?.connected){if(targetWindow&&!targetWindow.closed)try{targetWindow.close()}catch(_){};return printBluetoothReceipt(order,customer);}
  const w=targetWindow||window.open('','_blank','width=420,height=800');
  const receiptDocument=receiptHtml(order,customer);
  if(w){
    w.document.open();
    w.document.write(receiptDocument);
    w.document.close();
    return true;
  }
  // Popup-blocked fallback: print inside a hidden same-origin frame instead of losing the receipt.
  try{
    if(!receiptPrintFrame||!document.body.contains(receiptPrintFrame)){
      receiptPrintFrame=document.createElement('iframe');
      receiptPrintFrame.id='receiptPrintFrame';
      receiptPrintFrame.title='Receipt print frame';
      receiptPrintFrame.style.cssText='position:fixed;left:-10000px;top:0;width:58mm;height:1px;border:0;';
      document.body.appendChild(receiptPrintFrame);
    }
    const frameWindow=receiptPrintFrame.contentWindow;
    const frameDocument=frameWindow.document;
    const iframeHtml=receiptDocument.replace(
      /<script>window\.onload=\(\)=>\{window\.print\(\);setTimeout\(\(\)=>window\.close\(\),1200\)\}<\/script>/,
      '<script>window.onload=()=>{window.focus();window.print();};<\/script>'
    );
    frameDocument.open();frameDocument.write(iframeHtml);frameDocument.close();
    frameWindow.addEventListener('afterprint',()=>{if(receiptPrintFrame&&receiptPrintFrame.isConnected)receiptPrintFrame.remove();receiptPrintFrame=null;},{once:true});
    toast('Receipt print view prepared. If it does not appear, allow pop-ups for this POS and tap Print Receipt again.');
    return true;
  }catch(error){
    console.error('Receipt print fallback failed:',error);
    toast('Bill is saved. Print the receipt from Orders after allowing pop-ups.');
    return false;
  }
}

async function saveCustomer(name,mobile){
 if(!firebaseReady()) return null;
 const m=String(mobile||'').replace(/\D/g,'');
 const safeName=sanitizeText(name,60);
 if(m.length!==10||!safeName) return null;
 const existing=findCustomerByMobile(m);
 const data={name:safeName,mobile:m,lastVisit:new Date().toLocaleDateString('en-IN'),updatedAt:fs.serverTimestamp()};
 if(existing){ await fs.updateDoc(fs.doc(db,'customers',existing.id),data); return existing.id; }
 const ref=await fs.addDoc(fs.collection(db,'customers'),{...data,createdAt:fs.serverTimestamp()});
 return ref.id;
}
async function completePay(total,saveDetails=true,printReceiptAfterSave=false,button=null){
 if(paymentInFlight) return toast('Payment is already being processed');
 if(!firebaseReady()) return;
 if(!Array.isArray(state.cart)||!state.cart.length) return toast('Cart is empty');
 paymentInFlight=true;
 const actionButtons=[...document.querySelectorAll('#modalbox button[onclick^="completePay"]')];
 actionButtons.forEach(el=>{el.disabled=true;el.dataset.originalText=el.textContent;el.textContent='Saving…'});
 if(button){button.disabled=true;button.textContent='Saving…'}
 let receiptWindow=null;
 if(printReceiptAfterSave && !(fhBtCharacteristic&&fhBtDevice?.gatt?.connected)){
  try{receiptWindow=window.open('about:blank','_blank','width=420,height=800');}catch(error){console.warn('Receipt window could not be opened:',error)}
 }
 const payMethod=document.getElementById('payMethod')?.value||'Cash';
 const isHouseComp=payMethod==='House / Family (Comp)';
 const customerName=sanitizeText(state.pendingCustomer?.name||document.getElementById('custName')?.value||'Walk-in',60)||'Walk-in';
 const customerMobile=String(state.pendingCustomer?.mobile||document.getElementById('custMobile')?.value||'').replace(/\D/g,'');
 const subtotal=state.cart.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0);
 const discount=subtotal*(Number(state.settings.discount)||0)/100;
 const tax=(subtotal-discount)*Number(state.settings.tax||0)/100;
 const normalTotal=subtotal-discount+tax;
 const recordedSubtotal=isHouseComp?0:subtotal;
 const recordedDiscount=isHouseComp?0:discount;
 const recordedTax=isHouseComp?0:tax;
 const recordedTotal=isHouseComp?0:normalTotal;
 const now=new Date();
 const orderType=String(state.orderType||'DINE-IN').toUpperCase();
 const table=orderType==='DINE-IN'?sanitizeText(state.selectedTable,32):'—';
 const tableNumber=table==='—'?'':(table.match(/\d+/)?.[0]||'');
 const cartItems=state.cart.map(item=>({
  id:String(item.id||''),name:sanitizeText(item.name||'Item',100),price:Number(item.price||0),cost:Number(item.cost||0),
  qty:Math.max(1,Math.floor(Number(item.qty)||1)),note:sanitizeText(item.note||'',200),
  recipe:Array.isArray(item.recipe)?item.recipe.map(recipe=>({inventoryId:String(recipe?.inventoryId||'').trim(),qty:Number(recipe?.qty||0)})).filter(recipe=>recipe.inventoryId&&Number.isFinite(recipe.qty)&&recipe.qty>0):[]
 }));
 if(customerMobile && customerMobile.length!==10){paymentInFlight=false;actionButtons.forEach(el=>{el.disabled=false;el.textContent=el.dataset.originalText||'Save'});if(receiptWindow&&!receiptWindow.closed)receiptWindow.close();return toast('Enter a valid 10-digit mobile number');}
 if(customerMobile && !customerName){paymentInFlight=false;actionButtons.forEach(el=>{el.disabled=false;el.textContent=el.dataset.originalText||'Save'});if(receiptWindow&&!receiptWindow.closed)receiptWindow.close();return toast('Enter customer name');}
 if(!cartItems.length || cartItems.some(item=>!Number.isFinite(item.price)||item.price<0||!Number.isFinite(item.qty)||item.qty<1)){
  paymentInFlight=false;actionButtons.forEach(el=>{el.disabled=false;el.textContent=el.dataset.originalText||'Save'});if(receiptWindow&&!receiptWindow.closed)receiptWindow.close();return toast('One or more cart items have invalid quantities or prices');
 }
 const attemptId=paymentAttemptId();
 const orderRef=fs.doc(db,'orders',attemptId);
 const kotRef=fs.doc(db,'kots',`POS_${attemptId}`);
 const sequenceRef=fs.doc(db,'settings','main');
 const tableRecord=orderType==='DINE-IN'?(state.tables||[]).find(t=>sameTableName(t.name,table)):null;
 const tableRef=tableRecord?fs.doc(db,'tables',tableRecord.id):null;
 const menuIds=[...new Set(cartItems.map(item=>item.id).filter(Boolean))];
 const menuRefs=menuIds.map(id=>fs.doc(db,'menu',id));
 const recipeDeductions=new Map();
 cartItems.forEach(item=>item.recipe.forEach(recipe=>recipeDeductions.set(recipe.inventoryId,(recipeDeductions.get(recipe.inventoryId)||0)+(recipe.qty*item.qty))));
 const inventoryRefs=[...recipeDeductions.keys()].map(id=>fs.doc(db,'inventory',id));
 const inventoryLogRefs=[...recipeDeductions.keys()].map(()=>fs.doc(fs.collection(db,'inventoryLogs')));
 let committedOrder=null;
 let committedKot=null;
 let alreadyCommitted=false;
 try{
  if(saveDetails && customerMobile && customerName && !state.pendingCustomer){
   try{await saveCustomer(customerName,customerMobile)}catch(customerError){console.warn('Customer profile could not be saved; sale will continue:',customerError);toast('Sale will continue; customer profile could not be updated.')}
  }
  await fs.runTransaction(db,async transaction=>{
   const existingOrderSnapshot=await transaction.get(orderRef);
   if(existingOrderSnapshot.exists()){
    committedOrder={id:orderRef.id,...existingOrderSnapshot.data()};
    alreadyCommitted=true;
    return;
   }
   const sequenceSnapshot=await transaction.get(sequenceRef);
   const sequenceData=sequenceSnapshot.exists()?(sequenceSnapshot.data()||{}):{};
   const menuSnapshots=[];
   for(const ref of menuRefs) menuSnapshots.push({ref,snapshot:await transaction.get(ref)});
   const inventorySnapshots=[];
   for(const ref of inventoryRefs) inventorySnapshots.push({ref,snapshot:await transaction.get(ref)});
   let tableSnapshot=null;
   if(tableRef) tableSnapshot=await transaction.get(tableRef);

   for(const {ref,snapshot} of inventorySnapshots){
    if(!snapshot.exists()) throw new Error(`Recipe inventory item ${ref.id} no longer exists. Sale was not completed.`);
   }
   const billSequence=nextSequenceValue('billSequence','FH-',1049,sequenceData,(state.orders||[]).map(order=>({...order,code:String(order.code||'').replace(/^H-/i,'FH-')})));
   const kotSequence=nextSequenceValue('kotSequence','KOT-',102,sequenceData,[...(state.kots||[]),...(state.orders||[]).map(order=>({code:order.kotCode}))]);
   const billCode=formatBillCode(billSequence);
   const kotCode=formatKotCode(kotSequence);
   const orderDoc={
    code:billCode,kotCode,total:recordedTotal,subtotal:recordedSubtotal,discount:recordedDiscount,tax:recordedTax,payment:payMethod,
    isComp:isHouseComp,compType:isHouseComp?'House / Family (Comp)':'',time:now.toLocaleTimeString('en-IN'),date:now.toLocaleDateString('en-IN'),
    type:orderType,table,tableName:table,tableNumber,items:cartItems,customerName,customerMobile:customerMobile||'',businessAddress:BUSINESS_ADDRESS,
    cashier:sanitizeText(localStorage.getItem('feeling_hungry_cashier')||'biller',40),paymentStatus:'paid',status:'Completed',
    paidAt:fs.serverTimestamp(),createdAt:fs.serverTimestamp(),source:'pos',paymentAttemptId:attemptId
   };
   const kotDoc={
    code:kotCode,kotCode,order:billCode,orderId:orderRef.id,table,tableName:table,tableNumber,type:orderType,
    customerName:customerName||'Walk-in',customerMobile:customerMobile||'',specialNotes:'',items:cartItems.map(item=>({id:item.id,name:item.name,qty:item.qty,note:item.note,station:sanitizeText(state.menu.find(menuItem=>menuItem.id===item.id)?.station||'',30)})),
    status:'New',source:'pos',autoPrint:false,printStatus:'pending',time:orderDoc.time,date:orderDoc.date,createdAt:fs.serverTimestamp()
   };
   // All Firestore reads are complete above; writes below commit atomically.
   transaction.set(orderRef,orderDoc);
   transaction.set(kotRef,kotDoc);
   transaction.set(sequenceRef,{billSequence,kotSequence},{merge:true});
   menuSnapshots.forEach(({ref,snapshot})=>{if(snapshot.exists()){const soldQty=cartItems.filter(item=>item.id===ref.id).reduce((sum,item)=>sum+item.qty,0);if(soldQty)transaction.update(ref,{sold:fs.increment(soldQty)});}});
   inventorySnapshots.forEach(({ref,snapshot},index)=>{
    const amount=recipeDeductions.get(ref.id)||0;
    transaction.update(ref,{qty:fs.increment(-amount),updatedAt:fs.serverTimestamp(),lastDeduction:`Sale ${billCode}: recipe deduction ${amount}`});
    const inventoryName=sanitizeText(snapshot.data()?.name||ref.id,100);
    transaction.set(inventoryLogRefs[index],{type:'sale_recipe',ingredient:inventoryName,ingredientId:ref.id,qty:amount,delta:-amount,reason:`Automatic recipe deduction for ${billCode}`,date:now.toLocaleDateString('en-IN'),orderId:orderRef.id,createdAt:fs.serverTimestamp()});
   });
   if(tableRef && tableSnapshot?.exists()) transaction.set(tableRef,{status:'Billing',activeOrderId:orderRef.id,lastOrderCode:billCode,updatedAt:fs.serverTimestamp()},{merge:true});
   committedOrder={id:orderRef.id,...orderDoc};
   committedKot={id:kotRef.id,...kotDoc};
  });

  if(alreadyCommitted && !committedOrder) committedOrder={id:orderRef.id};
  if(committedOrder && !committedKot){
   const kotSnapshot=await fs.getDoc(kotRef);
   if(kotSnapshot.exists()) committedKot={id:kotRef.id,...kotSnapshot.data()};
  }
  if(printReceiptAfterSave){
   if(receiptWindow&&!receiptWindow.closed){
    const receiptCustomer=(customerName||customerMobile)?{name:customerName,mobile:customerMobile}:null;
    printReceipt(committedOrder,receiptCustomer,receiptWindow);
   }else{
    toast('Bill saved. Receipt popup was blocked; print it from Orders.');
   }
  }else if(receiptWindow&&!receiptWindow.closed){receiptWindow.close()}
  if(committedKot){
   const printSource={...committedKot,id:committedKot.id||kotRef.id,items:committedKot.items||cartItems,customerName:committedKot.customerName||customerName,table:committedKot.table||table,tableName:committedKot.tableName||table,tableNumber:committedKot.tableNumber||tableNumber};
   if(!autoPrintKOTSilently(printSource)) printKOT(printSource);
  }
  clearSavedTableCart(table);
  state.cart=[];state.pendingCustomer=null;state.reorderBillId=null;state.reorderBaseItems=[];state.reorderNewItems=[];
  localStorage.removeItem('feeling_hungry_payment_attempt_id');activePaymentAttemptId=null;
  closeModal();
  toast(alreadyCommitted?'This payment was already saved; duplicate stock deduction prevented.':(isHouseComp?'House / Family order saved at ₹0.':'Bill saved and KOT created.'));
  go('dashboard');
 }catch(error){
  if(receiptWindow&&!receiptWindow.closed)receiptWindow.close();
  console.error('Complete payment transaction failed:',error);
  toast(`Could not confirm the sale: ${sanitizeText(error?.message||error,150)}. Check Orders before retrying; retry uses the same sale ID.`);
 }finally{
  paymentInFlight=false;
  actionButtons.forEach(el=>{if(el.isConnected){el.disabled=false;el.textContent=el.dataset.originalText||'Save'}});
 }
}

function holdBill(){
  if(!state.cart.length) return toast('Nothing to hold');

  const defaultRef=(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table')
    ? state.selectedTable
    : `Bill-${Date.now()}`;
  const input=prompt('Enter a reference name for this held bill:',defaultRef);
  if(input===null) return;
  const reference=input.trim()||defaultRef;

  let held={};
  try{
    const raw=JSON.parse(localStorage.getItem('feeling_hungry_held')||'{}');
    if(raw && typeof raw==='object' && !Array.isArray(raw)) held=raw;
    else if(Array.isArray(raw) && raw.length) held[defaultRef]={reference:defaultRef,table:state.selectedTable||'—',orderType:state.orderType,cart:raw};
  }catch(e){ held={}; }

  if(held[reference] && !confirm(`A held bill named "${reference}" already exists. Replace it?`)) return;

  held[reference]={
    reference,
    table:state.selectedTable||'—',
    orderType:state.orderType,
    cart:state.cart.map(i=>({...i,qty:Math.max(1,Number(i.qty)||1),note:String(i.note||'')})),
    createdAt:Date.now()
  };
  localStorage.setItem('feeling_hungry_held',JSON.stringify(held));

  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    clearSavedTableCart(state.selectedTable);
  }
  state.cart=[];
  state.reorderBillId=null;
  state.reorderBaseItems=[];
  state.reorderNewItems=[];
  toast(`Bill held as "${reference}"`);
  render();
}

function retrieveBill(){
  let held={};
  try{
    const raw=JSON.parse(localStorage.getItem('feeling_hungry_held')||'{}');
    if(raw && typeof raw==='object' && !Array.isArray(raw)) held=raw;
    else if(Array.isArray(raw) && raw.length){
      const fallbackRef=(state.orderType==='DINE-IN' && state.selectedTable)?state.selectedTable:`Bill-${Date.now()}`;
      held[fallbackRef]={reference:fallbackRef,table:state.selectedTable||'—',orderType:state.orderType,cart:raw};
    }
  }catch(e){
    localStorage.removeItem('feeling_hungry_held');
    return toast('Held bill data was invalid and has been cleared');
  }

  const refs=Object.keys(held).filter(k=>Array.isArray(held[k]?.cart) && held[k].cart.length);
  if(!refs.length) return toast('No held bills');

  const defaultRef=(state.selectedTable && refs.includes(state.selectedTable))?state.selectedTable:refs[0];
  const input=prompt(`Enter the held bill reference to retrieve.\nAvailable: ${refs.join(', ')}`,defaultRef);
  if(input===null) return;
  const requested=input.trim()||defaultRef;
  const reference=refs.find(k=>k.toLowerCase()===requested.toLowerCase());
  if(!reference) return toast(`No held bill found for "${requested}"`);

  // Preserve any unsaved work on the currently selected table before replacing the active cart.
  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    state.tableCarts[state.selectedTable]=state.cart.map(i=>({...i}));
    state.tableCartUpdatedAt[state.selectedTable]=Date.now();persistTableCarts();
  }

  const bill=held[reference];
  const restoredTable=bill.table && bill.table!=='—' ? String(bill.table) : state.selectedTable;
  state.orderType=bill.orderType||'DINE-IN';
  if(state.orderType==='DINE-IN' && restoredTable && restoredTable!=='Select table') state.selectedTable=restoredTable;
  state.cart=bill.cart.map(i=>({...i,qty:Math.max(1,Number(i.qty)||1),note:String(i.note||'')}));

  if(state.orderType==='DINE-IN' && state.selectedTable && state.selectedTable!=='Select table'){
    state.tableCarts[state.selectedTable]=state.cart.map(i=>({...i}));
    state.tableCartUpdatedAt[state.selectedTable]=Date.now();persistTableCarts();
  }

  delete held[reference];
  localStorage.setItem('feeling_hungry_held',JSON.stringify(held));
  state.reorderBillId=null;
  state.reorderBaseItems=[];
  state.reorderNewItems=[];
  state.pendingCustomer=null;
  toast(`Held bill "${reference}" retrieved`);
  render();
}

function tableAction(id){

}
function showTableDetails(id){
  const t=state.tables.find(x=>String(x.id)===String(id));
  if(!t) return;
  const tableName=String(t.name||'');
  // Match canonical table labels so orders from QR selections (for example T1)
  // remain attached to the corresponding POS table (T-01).
  const tableOrders=state.orders.filter(o=>sameTableName(o.table, tableName))
    .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const tableKots=state.kots.filter(k=>sameTableName(k.table, tableName))
    .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

function timestampMillis(value){
 if(!value)return 0;
 if(typeof value.toMillis==='function')return value.toMillis();
 if(typeof value.seconds==='number')return value.seconds*1000;
 const parsed=Date.parse(value);return Number.isFinite(parsed)?parsed:0;
}
function loadTableCart(tableName,tableId=''){
 const key=String(tableName||'').trim();
 if(!key)return [];
 const savedCart=Array.isArray(state.tableCarts[key])?state.tableCarts[key]:[];
 const activeOrders=(state.orders||[]).filter(order=>
  (sameTableName(order.tableName||order.table,key)||String(order.tableId||'')===String(tableId)||String(order.id||'')===String(state.tables.find(t=>String(t.id)===String(tableId))?.activeOrderId||''))
  && !isOrderPaid(order) && Array.isArray(order.items) && order.items.length
 ).sort((a,b)=>timestampMillis(b.updatedAt||b.createdAt)-timestampMillis(a.updatedAt||a.createdAt));
 const activeOrder=activeOrders[0]||null;
 const savedAt=Number(state.tableCartUpdatedAt[key]||0);
 const orderAt=timestampMillis(activeOrder?.updatedAt||activeOrder?.createdAt);
 // Keep a newer local draft; otherwise restore the latest unpaid Firestore table order.
 const sourceItems=savedCart.length&&savedAt>orderAt?savedCart:(activeOrder?.items?.length?activeOrder.items:savedCart);
 state.cart=(Array.isArray(sourceItems)?sourceItems:[]).map(item=>({
  ...item,
  qty:Math.max(1,Math.floor(Number(item.qty)||1)),
  price:Number(item.price||0),
  note:sanitizeText(item.note||'',200)
 }));
 state.tableCarts[key]=state.cart.map(item=>({...item}));
 state.tableCartUpdatedAt[key]=Date.now();
 persistTableCarts();
 return state.cart;
}
function openTablePOS(id){

 state.selectedTable=tableName;

function getCustomerDirectory(){
  const map=new Map();
  (state.customers||[]).forEach(c=>{
    const mobile=String(c.mobile||'').replace(/\D/g,'');
    if(!mobile) return;
    map.set(mobile,{...c,mobile});
  });
  // Also surface customers already attached to historical orders, even if the
  // customer document was created before the Customers section existed.
  (state.orders||[]).forEach(o=>{
    const mobile=String(o.customerMobile||'').replace(/\D/g,'');
    if(!mobile) return;
    const existing=map.get(mobile)||{mobile,name:o.customerName||'Customer'};
    if(!existing.name && o.customerName) existing.name=o.customerName;
    map.set(mobile,existing);
  });
  return [...map.values()].map(c=>{
    const orders=(state.orders||[]).filter(o=>String(o.customerMobile||'').replace(/\D/g,'')===c.mobile);
    const paidOrders=orders.filter(isOrderPaid);
    return {...c,
      orderCount:paidOrders.length,
      totalSpent:paidOrders.reduce((a,o)=>a+Number(o.total||0),0),
      lastOrder:orders[0]||orders.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0]||null
    };
  }).sort((a,b)=>Number(b.totalSpent||0)-Number(a.totalSpent||0));
}

function printTableReceipt(tableId){
  const table=state.tables.find(x=>String(x.id)===String(tableId));
  if(!table) return toast('Table not found');
  const orders=state.orders.filter(o=>sameTableName(o.table,table.name));
  if(!orders.length) return toast('No orders to print for this table');

  // Combine matching items from every order on this table into one bill.
  const grouped=new Map();
  for(const order of orders){
    for(const item of (Array.isArray(order.items)?order.items:[])){
      const name=String(item.name||'Item');
      const price=Number(item.price||0);
      const note=String(item.note||'');
      const key=[name,price,note].join('|');
      const existing=grouped.get(key);
      if(existing) existing.qty+=Number(item.qty||0);
      else grouped.set(key,{name,price,qty:Number(item.qty||0),note});
    }
  }
  const items=[...grouped.values()];
  const subtotal=orders.reduce((sum,o)=>{
    const fallback=(o.items||[]).reduce((v,i)=>v+Number(i.price||0)*Number(i.qty||0),0);
    return sum+Number(o.subtotal??fallback);
  },0);
  const total=orders.reduce((sum,o)=>{
    const fallback=(o.items||[]).reduce((v,i)=>v+Number(i.price||0)*Number(i.qty||0),0);
    return sum+Number(o.total??fallback);
  },0);
  const latest=orders.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))[0]||{};
  const receiptOrder={
    code:`TABLE-${String(table.name||'').replace(/[^a-z0-9-]/gi,'')}`,
    type:'DINE-IN',
    table:table.name,
    items,
    subtotal,
    total,
    date:new Date().toLocaleDateString('en-GB'),
    time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
    cashier:latest.cashier||'biller'
  };
  printReceipt(receiptOrder,null);
}

function collectRecipe(){
 const rows=[...document.querySelectorAll('#recipeList [data-recipe-row]')];
 const recipe=[]; const seen=new Set();
 for(const row of rows){
   const inventoryId=String(row.querySelector('.recipe-inventory')?.value||'').trim();
   const qty=Number(row.querySelector('.recipe-qty')?.value);
   if(!inventoryId && !Number.isFinite(qty)) continue;
   if(!inventoryId) return {error:'Select an inventory item for every recipe row'};
   if(!Number.isFinite(qty)||qty<=0) return {error:'Enter a valid recipe quantity for every ingredient'};
   if(seen.has(inventoryId)) return {error:'The same inventory item cannot be added twice'};
   seen.add(inventoryId); recipe.push({inventoryId,qty});
 }
 return {recipe};
}

function expenseDateKey(expense){
  try{
    if(expense.createdAt && typeof expense.createdAt.toDate==='function'){
      return dateKeyLocal(expense.createdAt.toDate());
    }
    if(expense.createdAt && typeof expense.createdAt.seconds==='number'){
      return dateKeyLocal(new Date(expense.createdAt.seconds*1000));
    }
    if(expense.dateKey) return String(expense.dateKey);

    const raw=String(expense.date||'').trim();
    let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){
      return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    }
    m=raw.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(m){
      return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }
  }catch(e){
    console.error('Expense date parsing error:',e);
  }
  return '';
}

function expenseDisplayDate(expense){
  try{
    if(expense.createdAt && typeof expense.createdAt.toDate==='function'){
      return expense.createdAt.toDate().toLocaleString('en-IN');
    }
    if(expense.createdAt && typeof expense.createdAt.seconds==='number'){
      return new Date(expense.createdAt.seconds*1000).toLocaleString('en-IN');
    }
  }catch(e){}
  return `${expense.date||'—'}${expense.time?` • ${expense.time}`:''}`;
}

let salesReportMode='today';
let salesReportDate='';
function dateKeyLocal(d){
 const x=new Date(d);
 if(Number.isNaN(x.getTime())) return '';
 return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function orderLocalDate(o){
 try{
  if(o.createdAt && typeof o.createdAt.toDate==='function') return dateKeyLocal(o.createdAt.toDate());
  if(o.createdAt && typeof o.createdAt.seconds==='number') return dateKeyLocal(new Date(o.createdAt.seconds*1000));
  if(o.date){
   const raw=String(o.date).trim();
   let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
   if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
   m=raw.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
   if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  if(o.time && /^\d{4}-\d{2}-\d{2}/.test(String(o.time))) return String(o.time).slice(0,10);
 }catch(e){}
 return '';
}
function salesDateFilter(){
  const now=new Date();
  const today=dateKeyLocal(now);
  if(salesReportMode==='today') return {from:today,to:today,label:'Today'};
  if(salesReportMode==='yesterday') { const d=new Date(now); d.setDate(d.getDate()-1); const x=dateKeyLocal(d); return {from:x,to:x,label:'Yesterday'}; }
  if(salesReportMode==='week') { const d=new Date(now); const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return {from:dateKeyLocal(d),to:today,label:'This Week'}; }
  if(salesReportMode==='month') return {from:`${today.slice(0,7)}-01`,to:today,label:'This Month'};
  if(salesReportMode==='lastmonth') { const d=new Date(now.getFullYear(),now.getMonth()-1,1); const e=new Date(now.getFullYear(),now.getMonth(),0); return {from:dateKeyLocal(d),to:dateKeyLocal(e),label:'Last Month'}; }
  if(salesReportMode==='custom' && salesReportDate) return {from:salesReportDate,to:salesReportDate,label:new Date(salesReportDate+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
  return {from:today,to:today,label:'Select a date'};
}
function setSalesMode(v){salesReportMode=v; if(v!=='custom') salesReportDate=''; render();}
function setSalesDate(v){salesReportDate=String(v||''); render();}
function sales(){
 const range=salesDateFilter();
 const filtered=state.orders.filter(o=>isOrderPaid(o)&&(()=>{const d=orderLocalDate(o);return d&&d>=range.from&&d<=range.to;})());
 const revenue=filtered.reduce((a,o)=>a+Number(o.total||0),0);
 const orders=filtered.length;
 const aov=orders?revenue/orders:0;
 const highest=filtered.reduce((m,o)=>Math.max(m,Number(o.total||0)),0);
 const items={};
 filtered.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name||'Unknown'; if(!items[k]) items[k]={qty:0,revenue:0}; items[k].qty+=Number(i.qty||0); items[k].revenue+=Number(i.price||i.rate||0)*Number(i.qty||0);}));
 const rows=Object.entries(items).sort((a,b)=>b[1].revenue-a[1].revenue);
 return pageTitle('Sales Reports','Revenue, orders, AOV, item/category/combo and payment reports')+`
 <div class="card">
   <div class="filters" style="align-items:end;flex-wrap:wrap">
     <label style="min-width:150px"><span class="muted">Revenue Period</span><select id="salesMode" class="select" onchange="setSalesMode(this.value)">
       <option value="today" ${salesReportMode==='today'?'selected':''}>Today</option><option value="yesterday" ${salesReportMode==='yesterday'?'selected':''}>Yesterday</option><option value="week" ${salesReportMode==='week'?'selected':''}>This Week</option><option value="month" ${salesReportMode==='month'?'selected':''}>This Month</option><option value="lastmonth" ${salesReportMode==='lastmonth'?'selected':''}>Last Month</option><option value="custom" ${salesReportMode==='custom'?'selected':''}>Custom Date</option>
     </select></label>
     ${salesReportMode==='custom'?`<label style="min-width:180px"><span class="muted">Type / select date</span><input class="input" type="date" value="${salesReportDate}" onchange="setSalesDate(this.value)"></label>`:''}
     <button class="btn" onclick="render()">Refresh</button><button class="btn" onclick="exportCSV()">Export CSV</button>
   </div>
   <div class="section" style="padding:10px 0"><b>${range.label}</b><span class="muted"> — ${filtered.length} matching paid order${filtered.length===1?'':'s'}</span></div>
   <div class="grid three section">${[['Revenue',revenue],['Orders',orders],['AOV',aov],['Highest Order',highest],['Discounts',0],['Tax Collected',0]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><h2>${x[0]==='Orders'?x[1]:money(x[1])}</h2></div>`).join('')}</div>
   <div class="table-wrap section"><table class="data"><thead><tr><th>Item</th><th>Qty</th><th>Revenue</th><th>Share</th></tr></thead><tbody>${rows.length?rows.map(([name,x])=>`<tr><td>${name}</td><td>${x.qty}</td><td>${money(x.revenue)}</td><td>${revenue?Math.round(x.revenue/revenue*100):0}%</td></tr>`).join(''):`<tr><td colspan="4" class="empty">No sales found for ${range.label}. Try another date.</td></tr>`}</tbody></table></div>
 </div>`;
}
function invreports(){
 const now=new Date(), month=now.getMonth(), year=now.getFullYear();
 const monthPurchases=state.purchases.filter(p=>{const raw=String(p.date||''); const m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); return m?Number(m[2])-1===month&&Number(m[3])===year:false;}).reduce((a,p)=>a+Number(p.total||0),0);
 const stockValue=state.inventory.reduce((a,x)=>a+Number(x.qty||0)*Number(x.cost||0),0);
 const low=state.inventory.filter(x=>Number(x.qty||0)<=Number(x.min||0)).length;
 return `<div class="top"><div><h1>Inventory Reports</h1><p>Live stock value and purchase summary from Firestore</p></div></div><div class="grid three">${[['Current Stock Value',stockValue],['Purchases This Month',monthPurchases],['Inventory Items',state.inventory.length],['Low Stock Items',low]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><h2>${x[0]==='Inventory Items'||x[0]==='Low Stock Items'?x[1]:money(x[1])}</h2><p class="muted">Live calculated value</p></div>`).join('')}</div><div class="card section"><h2>Stock Equation</h2><p class="muted">Current stock value = quantity × current cost for every inventory item.</p></div>`;
}
function pnl(){
 const paidOrders=state.orders.filter(isOrderPaid);
 const rev=paidOrders.reduce((a,o)=>a+Number(o.total||0),0);
 const cogs=paidOrders.reduce((a,o)=>a+(o.items||[]).reduce((s,i)=>{const m=state.menu.find(x=>x.id===i.id||x.name===i.name);const cost=Number(i.cost??m?.cost??0);return s+cost*Number(i.qty||0)},0),0);
 const otherOp=state.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const staffSalary=state.staff.reduce((a,x)=>a+Number(x.salary||0),0);
 const op=otherOp+staffSalary;
 return pageTitle('Profit & Loss','Revenue, COGS, staff salaries and other operating expenses')+`<div class="card"><div class="grid three"><div><span class="muted">Revenue</span><h2>${money(rev)}</h2></div><div><span class="muted">COGS / Product Cost</span><h2>${money(cogs)}</h2></div><div><span class="muted">Staff Salaries / Month</span><h2>${money(staffSalary)}</h2></div></div><div class="grid three section"><div><span class="muted">Other Operating Expenses</span><h2>${money(otherOp)}</h2></div><div><span class="muted">Total Operating Expenses</span><h2>${money(op)}</h2></div><div><span class="muted">Net Profit</span><h2 class="${rev-cogs-op>=0?'up':''}">${money(rev-cogs-op)}</h2></div></div><div class="section"><div class="card"><div class="section-title"><h2>Gross Profit</h2><b>${money(rev-cogs)}</b></div><div class="section-title"><h2>Net Profit</h2><b class="${rev-cogs-op>=0?'up':''}">${money(rev-cogs-op)}</b></div><p class="muted">Staff salaries are taken from the salary amounts saved in the Staff section and included in operating expenses. Other expenses come from the Expenses section.</p></div></div></div>`}
function staff(){return pageTitle('Staff & Permissions','Role-based access, staff salary and audit activity')+`<div class="card"><button class="btn primary" onclick="addStaff()">＋ Add Staff</button><div class="table-wrap section"><table class="data"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Monthly Salary</th><th>Bills</th><th>KOT</th><th></th></tr></thead><tbody>${state.staff.length?state.staff.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><span class="badge blue">${x.role}</span></td><td><span class="badge good">${x.status||'Active'}</span></td><td><b>${money(x.salary||0)}</b></td><td>${x.bills||0}</td><td>${x.kot||0}</td><td style="display:flex;gap:6px"><button class="btn" onclick="viewStaff('${x.id}')">View / Edit</button><button class="btn danger" onclick="deleteStaff('${x.id}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No staff added yet.</td></tr>'}</tbody></table></div></div>`}
async function deleteStaff(id){
 const s=state.staff.find(x=>x.id===id);
 if(!confirm(`Delete staff member${s?' "'+s.name+'"':''}? This cannot be undone.`)) return;
 await fs.deleteDoc(fs.doc(db,'staff',id));

}
function addStaff(existing=null){
 openModal(`<button class="close" onclick="closeModal()">×</button><h2>${existing?'Edit Staff':'Add Staff'}</h2><div class="formgrid"><label class="full">Name<input id="stn" class="input" value="${existing?.name||''}"></label><label>Role<select id="str" class="select">${['ADMIN','MANAGER','CASHIER','KITCHEN STAFF'].map(r=>`<option ${existing?.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Monthly Salary<input id="sts" class="input" type="number" min="0" step="0.01" value="${existing?.salary||0}" placeholder="e.g. 18000"></label></div><p class="muted" style="margin-top:10px">This monthly salary is automatically included in Profit & Loss as a staff salary expense.</p><div class="actions"><button class="btn primary" onclick="${existing?`updateStaff('${existing.id}')`:'saveStaff()'}">${existing?'Save Changes':'Save Staff'}</button></div>`);
}
async function saveStaff(){
 if(!stn.value.trim()) return toast('Enter a staff name');
 const salary=Math.max(0,Number(sts.value)||0);
 await fs.addDoc(fs.collection(db,'staff'), {name:stn.value.trim(), role:str.value, status:'Active', salary, bills:0, kot:0});
 closeModal(); toast('Staff added');
}

}

 if(!stn.value.trim()) return toast('Enter a staff name');

 await fs.updateDoc(fs.doc(db,'staff',id), {name:stn.value.trim(),role:str.value,salary});
 closeModal(); toast('Staff details updated');
}

function settings(){return pageTitle('Settings','Business, tax, discount, kitchen and printing preferences')+`<div class="grid two"><div class="card"><h2>Business</h2><div class="formgrid"><label>Business Name<input class="input" value="Feeling Hungry"></label><label>GSTIN<input class="input" placeholder="Optional"></label><label class="full">Address<textarea readonly>${esc(BUSINESS_ADDRESS)}</textarea></label><label>Phone<input class="input" placeholder="Business phone"></label><label>Email<input class="input" placeholder="Business email"></label></div></div><div class="card"><h2>POS & Printing</h2><div class="formgrid"><label>Tax %<input id="taxSet" class="input" type="number" min="0" max="100" step="0.01" value="${state.settings.tax}"></label><label>Default Discount %<input id="discountSet" class="input" type="number" min="0" max="100" step="0.01" value="${state.settings.discount||0}"></label><label>KOT Paper Width<select id="kotWidthSet" class="select"><option value="58" ${Number(state.settings.kotWidth||58)===58?'selected':''}>58 mm (POS58)</option><option value="79" ${Number(state.settings.kotWidth||58)===79?'selected':''}>79 mm</option></select></label><label>Receipt Width<select id="receiptSet" class="select"><option value="58" ${Number(state.settings.receipt||58)===58?'selected':''}>58 mm (POS58)</option><option value="79" ${Number(state.settings.receipt||58)===79?'selected':''}>79 mm</option></select></label><label>Default Order Type<select class="select"><option>DINE-IN</option><option>TAKEAWAY</option></select></label><label>Auto Print KOT for Online Orders<select id="autoPrintOnlineSet" class="select"><option value="on" ${state.autoPrintOnlineKots?'selected':''}>On — print kitchen ticket automatically</option><option value="off" ${!state.autoPrintOnlineKots?'selected':''}>Off — add tickets to KDS without auto-printing</option></select></label></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save Settings</button></div></div><div class="card"><h2>POS58 Thermal Printer Setup</h2><p class="muted">The supplied installer is a generic POS58 Windows printer-driver package. Install it on the POS computer, select the POS58 printer in Windows, set paper width to 58mm and disable browser headers and footers. This file now defaults both receipt and KOT layouts to 58mm. Test-feed and paper-cut behavior depend on the installed driver and printer hardware.</p></div><div class="card"><h2>Silent KOT Printing</h2><p class="muted">Every new Digital Menu / QR KOT is automatically sent to the kitchen printer when this POS is open and connected to Firebase — no repeated Print button clicks are needed. For silent printing without a Chrome dialog, configure Chrome kiosk printing on the POS computer and set the POS58 printer as the Windows default printer. Keep this POS tab open while taking online orders.</p><p class="muted"><b>Important:</b> Chrome must be started with the <code>--kiosk-printing</code> flag. Otherwise Chrome will show its print dialog and staff must select the POS58 printer.</p></div><div class="card firebase-device-card"><h2>Firebase Connection</h2><p class="muted">Shared Windows + Mobile project: <b>${firebaseConfig.projectId}</b></p><p class="muted">Current browser origin: <code>${esc(location.origin)}</code></p>${firebaseStatus==='connected'?'<span class="badge good">Connected — live Firestore sync active</span>':firebaseStatus==='error'?`<span class="badge bad">Connection error</span><p class="muted">${esc(firebaseError)}</p>`:'<span class="badge warn">Connecting…</span>'}<div style="margin-top:12px"><b>Mobile POS Device ID</b>${firebaseDeviceUid?`<code style="display:block;overflow-wrap:anywhere;word-break:break-all;padding:10px;margin-top:7px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(0,0,0,.25);color:#fff">${esc(firebaseDeviceUid)}</code><div class="actions"><button class="btn blue" type="button" onclick="copyPosDeviceUid()">Copy Mobile Device ID</button><button class="btn" type="button" onclick="reconnectFirebase()">Retry connection</button></div>`:'<p class="muted">The ID will appear after Firebase anonymous sign-in finishes.</p>'}</div><p class="muted" style="margin-top:10px">The mobile browser has its own persistent anonymous Firebase UID. Add this UID to the existing approved POS-device list in your Firestore Security Rules, alongside the Windows POS UID. Keep the existing restrictions; do not enable public database writes. Do not clear this PWA site data after approval.</p></div><div class="card"><h2>Customer & Receipt Data</h2><p class="muted">Customer name and mobile can be saved during billing. Entering the same mobile on a future bill automatically finds the saved customer. Receipts print on a white background with larger text.</p></div><div class="card"><h2>Data Integrity</h2><p class="muted">Orders, KOTs, menu, inventory, suppliers and expenses are stored in Firestore collections and sync in real time across devices. Historical order/menu prices are captured at time of sale.</p></div></div>`}
async function saveSettings(){
 if(!firebaseReady()) return;
 const tax=Math.max(0,+document.getElementById('taxSet').value||0);
 const discount=Math.min(100,Math.max(0,+document.getElementById('discountSet').value||0));
 const receipt=+(document.getElementById('receiptSet').value||58);
 const kotWidth=+(document.getElementById('kotWidthSet').value||58);
 const autoPrintOnline=document.getElementById('autoPrintOnlineSet')?.value!=='off';
 state.autoPrintOnlineKots=autoPrintOnline;
 state.settings={...state.settings,tax,discount,receipt,kotWidth,printerProfile:'POS58'};
 await fs.setDoc(fs.doc(db,'settings','main'), {...state.settings,tax,discount,receipt,kotWidth,printerProfile:'POS58',autoPrintOnlineKots:autoPrintOnline}, {merge:true});
 toast('Settings saved'); render();
}

function initProfitLossChart(){
 try{
  const canvas=document.getElementById('profitLossChart');
  if(!canvas) return;
  if(!window.Chart){const wrap=canvas.parentElement;if(wrap)wrap.innerHTML='<div class="pnl-fallback">Profit &amp; Loss chart is unavailable until the chart library loads.</div>';return;}
  const days=[];const today=new Date();
  for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(today.getDate()-i);days.push({key:dateKeyLocal(d),label:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})});}
  const totals=Object.fromEntries(days.map(d=>[d.key,{revenue:0,cogs:0,expenses:0,profit:0}]));
  (state.orders||[]).forEach(o=>{
    const key=orderLocalDate(o);if(!totals[key])return;
    totals[key].revenue+=Number(o.total||0);
    (o.items||[]).forEach(i=>{
      const menuItem=(state.menu||[]).find(m=>m.id===i.id||String(m.name||'').trim().toLowerCase()===String(i.name||'').trim().toLowerCase());
      let unitCost=Number(i.cost||0);
      if(unitCost<=0) unitCost=Number(menuItem?.cost||0);
      if(unitCost<=0 && Array.isArray(i.recipe) && i.recipe.length){
        unitCost=i.recipe.reduce((sum,r)=>{
          const ingredient=(state.inventory||[]).find(x=>x.id===r.inventoryId||x.name===r.name);
          return sum+Number(r.qty||0)*Number(ingredient?.cost||0);
        },0);
      }
      totals[key].cogs+=Math.max(0,unitCost)*Math.max(0,Number(i.qty||0));
    });
  });
  (state.expenses||[]).forEach(e=>{
    const key=expenseDateKey(e);if(!totals[key])return;
    totals[key].expenses+=Number(e.amount||0);
  });
  days.forEach(d=>{const t=totals[d.key];t.profit=t.revenue-t.cogs-t.expenses;});
  const labels=days.map(d=>d.label);
  const values=k=>days.map(d=>Math.round((totals[d.key][k]||0)*100)/100);
  const chartSignature=JSON.stringify({labels,revenue:values('revenue'),cogs:values('cogs'),expenses:values('expenses'),profit:values('profit')});
  if(window.feelingHungryPnLChart && window.feelingHungryPnLChart.canvas===canvas && window.feelingHungryPnLChart.__fhSignature===chartSignature) return;
  if(window.feelingHungryPnLChart){try{window.feelingHungryPnLChart.destroy()}catch(e){}window.feelingHungryPnLChart=null;}
  const ctx=canvas.getContext('2d');
  const gradient=(top,bottom)=>{const g=ctx.createLinearGradient(0,0,0,260);g.addColorStop(0,top);g.addColorStop(1,bottom);return g;};
  const chart=new Chart(ctx,{type:'line',data:{labels,datasets:[
   {label:'Revenue',data:values('revenue'),borderColor:'#22a06b',backgroundColor:gradient('rgba(34,157,103,.13)','rgba(34,157,103,.01)'),fill:false,tension:.3,borderWidth:2.2,pointRadius:3,pointHoverRadius:5},
   {label:'COGS',data:values('cogs'),borderColor:'#3978c9',backgroundColor:gradient('rgba(57,120,201,.10)','rgba(57,120,201,.01)'),fill:false,tension:.3,borderWidth:2,pointRadius:3,pointHoverRadius:5},
   {label:'Expenses',data:values('expenses'),borderColor:'#f59e0b',backgroundColor:gradient('rgba(245,158,11,.10)','rgba(245,158,11,.01)'),fill:false,tension:.3,borderWidth:2,pointRadius:3,pointHoverRadius:5},
   {label:'Net Profit',data:values('profit'),borderColor:'#7c5ac7',backgroundColor:gradient('rgba(124,90,199,.15)','rgba(124,90,199,.01)'),fill:true,tension:.3,borderWidth:3,pointRadius:3,pointHoverRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#18202b',padding:10,callbacks:{label:c=>`${c.dataset.label}: ₹${Number(c.parsed.y||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`}}},scales:{x:{grid:{display:false},ticks:{color:'#7a8796',font:{size:10,weight:'600'}}},y:{grid:{color:'rgba(148,163,184,.16)'},ticks:{color:'#7a8796',font:{size:10},callback:v=>`₹${Number(v).toLocaleString('en-IN')}`},border:{display:false}}}}});
  chart.__fhSignature=chartSignature;
  window.feelingHungryPnLChart=chart;
 }catch(err){console.error('Profit & Loss chart error:',err);}
}

   dashboard:dashboard,pos:pos,tables:tables,orders:orders,kot:kot,kitchen:kitchen,menu:menu,combos:combos,
