/* ===== Modern dashboard refresh ===== */
:root{
  --bg:#eef1f5;
  --panel:#ffffff;
  --panel2:#e7ebf0;
  --soft:#f5f7fa;
  --line:#d9dee6;
  --text:#17202d;
  --muted:#697586;
  --accent:#f59e0b;
  --good:#1f9d67;
  --warn:#d97706;
  --bad:#dc4c4c;
  --blue:#3978c9;
  --r:14px;
  --shadow:0 8px 24px rgba(15,23,42,.07);
  --shadow-soft:0 3px 12px rgba(15,23,42,.05);
}
body{background:var(--bg);color:var(--text)}
.sidebar{background:#fff;box-shadow:4px 0 22px rgba(15,23,42,.06);border-right:1px solid #dfe3e8}
.nav button{transition:background .18s ease,color .18s ease,transform .18s ease}
.nav button:hover{background:#fff7eb;color:#b85e00;transform:translateX(1px)}
.nav button.active{background:#fff1dc;color:#b85e00;font-weight:800;box-shadow:inset 3px 0 0 var(--accent)}
.nav button.active .ico{color:#d97706}
.card{box-shadow:var(--shadow);border-color:#dfe4ea}
.top h1{font-weight:800;letter-spacing:-.02em}
.top p{color:#788496}
.btn{box-shadow:0 2px 6px rgba(15,23,42,.04)}
.btn.primary{background:var(--accent);color:#1d1608;box-shadow:0 5px 14px rgba(245,158,11,.22)}

/* Metric cards */
.stats{gap:15px}
.stats .stat{position:relative;overflow:hidden;min-height:136px;padding:17px 18px;border-radius:16px}
.stats .stat:after{content:"";position:absolute;right:-20px;bottom:-28px;width:118px;height:118px;border-radius:50%;background:currentColor;opacity:.055;pointer-events:none}
.stats .stat .metric-icon{position:absolute;right:18px;top:14px;font-size:42px;opacity:.12;line-height:1;pointer-events:none}
.stats .stat .label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#667085}
.stats .stat .value{font-size:27px;line-height:1.1;font-weight:850;letter-spacing:-.02em;color:#151b24;margin:10px 0 7px}
.stats .stat .muted{font-size:12px}
.stats .stat.metric-sales{color:#c77800;border-top:3px solid #f59e0b}
.stats .stat.metric-orders{color:#3978c9;border-top:3px solid #3978c9}
.stats .stat.metric-items{color:#7c5ac7;border-top:3px solid #7c5ac7}
.stats .stat.metric-profit{color:#1f9d67;border-top:3px solid #1f9d67}
.stats .stat.metric-profit .value{color:#12633f}
.stats .stat.metric-orders .value{color:#173f73}
.stats .stat.metric-sales .value{color:#151b24}
.stats .stat.metric-items .value{color:#3f316b}

/* Dashboard status badges */
.ops-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ops-status{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fafbfc}
.ops-status .ops-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:850;flex:0 0 38px}
.ops-status .ops-copy{min-width:0}
.ops-status .ops-copy span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.ops-status .ops-copy b{font-size:21px;line-height:1;color:#17202d}
.ops-status.available .ops-dot{background:#dcf7e9;color:#147347}
.ops-status.preparing .ops-dot{background:#fff0ca;color:#9a6700}
.ops-status.ready .ops-dot{background:#dcecff;color:#245f9f}
.ops-status.occupied .ops-dot{background:#f1e8ff;color:#7351a8}

/* Payment donut */
.payment-layout{display:grid;grid-template-columns:minmax(180px,220px) 1fr;gap:18px;align-items:center}
.payment-donut-wrap{display:grid;place-items:center;min-height:190px}
.payment-donut{width:170px;height:170px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06)}
.payment-donut:after{content:"";position:absolute;inset:38px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(15,23,42,.05)}
.payment-donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;padding-top:2px}
.payment-donut-center b{font-size:17px;color:#141a22}
.payment-donut-center span{display:block;font-size:10px;color:var(--muted);margin-top:-32px}
.payment-legend{display:grid;gap:11px}
.payment-item{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center}
.payment-item .swatch{width:10px;height:10px;border-radius:50%}
.payment-item .p-label{font-size:12px;color:#596578}
.payment-item .p-value{font-size:13px;font-weight:800;color:#18202b}
.payment-item .p-percent{display:block;font-size:10px;color:#8a94a3;margin-top:1px}

/* Accounting tables */
.dashboard-table{border-radius:11px;overflow:hidden;border:1px solid #e4e7ec}
.dashboard-table .data thead th{background:#f7f8fa;border-bottom:1px solid #e0e4ea;color:#667085;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.dashboard-table .data tbody tr:nth-child(even){background:#fafbfc}
.dashboard-table .data tbody tr:hover{background:#fff6e8}
.dashboard-table .data td{font-size:12px;color:#283240}
.dashboard-table .data td.amount-cell{font-weight:800;color:#151b24;text-align:right}
.dashboard-table .data td.qty-cell{text-align:center;font-weight:700;color:#475467}
.top-items-table .item-name{font-weight:750;color:#1a2430}
.top-items-table .category-note{font-size:10px;color:#8a94a3;margin-top:2px}

@media(max-width:900px){
  .payment-layout{grid-template-columns:1fr}
  .payment-donut-wrap{min-height:165px}
}
@media(max-width:700px){
  .ops-grid{grid-template-columns:1fr}
  .stats .stat{min-height:124px}
}


/* ===== Premium dashboard polish + P&L chart ===== */
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.005em}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(15,23,42,.085);border-color:#d4dbe5}
.section-title h2{font-weight:800;letter-spacing:-.015em}
.dashboard-table .data tbody tr{transition:background .16s ease}
.payment-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;line-height:1;white-space:nowrap;border:1px solid transparent}
.payment-pill i{font-size:9px}
.payment-pill.cash{background:#e6f7ee;color:#11704a;border-color:#c8ecd9}
.payment-pill.upi{background:#e8f0ff;color:#245e9f;border-color:#cdddf8}
.payment-pill.card{background:#fff0dc;color:#a85b06;border-color:#f5d7ad}
.payment-pill.other{background:#eef1f5;color:#586475;border-color:#dbe0e7}
.pnl-card{padding:16px 18px 18px}
.pnl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.pnl-head h2{margin:0;font-size:16px}
.pnl-subtitle{margin:4px 0 0;color:#7b8798;font-size:11px}
.pnl-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pnl-legend span{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#687385;font-weight:700}
.pnl-legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
.pnl-chart-wrap{position:relative;height:265px;min-height:220px}
.pnl-chart-wrap canvas{display:block;width:100%!important;height:100%!important}
.pnl-fallback{height:100%;display:grid;place-items:center;border:1px dashed #d9dee6;border-radius:12px;background:#fafbfc;color:#7a8796;font-size:12px;text-align:center;padding:20px}
@media(max-width:700px){.pnl-head{flex-direction:column}.pnl-chart-wrap{height:235px}}


/* Organized pizza size picker: Small → Medium → Large */
.pizza-menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.pizza-menu-card{display:flex;flex-direction:column;gap:13px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-soft)}
.pizza-card-top{display:flex;align-items:flex-start;gap:11px;min-width:0}
.pizza-card-emoji{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:12px;background:#fff2db;font-size:26px}
.pizza-card-copy{min-width:0;flex:1}
.pizza-card-name{font-size:14px;font-weight:850;line-height:1.35;color:var(--text);overflow-wrap:anywhere}
.pizza-card-subtitle{font-size:11px;line-height:1.45;color:var(--muted);margin-top:4px}
.pizza-size-heading{font-size:10px;font-weight:850;letter-spacing:.09em;color:var(--muted)}
.pizza-size-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pizza-size-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;min-height:62px;padding:8px 3px;border:1px solid #f2d4a2;border-radius:10px;background:#fff8ec;color:#68400b;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.pizza-size-btn:hover{transform:translateY(-1px);border-color:var(--accent);background:#fff0cf}
.pizza-size-label{font-size:11px;font-weight:850;line-height:1.2}
.pizza-size-price{font-size:12px;font-weight:850;line-height:1.2;white-space:nowrap}
.pizza-size-btn:disabled{cursor:not-allowed;transform:none;border-color:var(--line);background:var(--soft);color:#98a1ae}
.pizza-size-btn:disabled .pizza-size-price{font-size:10px;font-weight:650;white-space:normal}
.pizza-single-note{font-size:11px;color:var(--muted);margin-top:auto}
.pizza-single-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:1100px){.pizza-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.pizza-menu-grid{grid-template-columns:1fr}.pizza-menu-card{padding:12px}.pizza-size-options{gap:8px}}

/* Premium Midnight Glass Theme Override */
body {
  background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed !important;
  background-size: cover !important;
  color: #fff !important;
}

/* Force transparent containers */
.app, .main, table, tbody, tr, td, th, .dashboard-table .data tbody tr:nth-child(even), .dashboard-table .data tbody tr:hover {
  background: transparent !important;
}

/* Dark Frosted Panels with realistic edge lighting */
.sidebar, .card, .menu-category-block, .product, .table-card, .kcol, .modalbox, .auth-box, .pizza-menu-card, .build-burger-card {
  background: rgba(15, 23, 42, 0.55) !important;
  
  
  border: 1px solid transparent !important;
  border-image: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 60%) 1 !important;
  border-radius: 20px !important;
  box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5) !important;
  color: #fff !important;
}

/* Glassy Inputs and neutral buttons */
.input, .select, textarea, .nav button, .pos-category-title, .menu-category-head {
  background: rgba(15, 23, 42, 0.4) !important;
  
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  color: #fff !important;
}

/* Luminous accents: primary actions, active states, prices */
.btn.primary, .cat.active, .nav button.active, .price, .accent {
  background: #ffb020 !important;
  color: #17130b !important;
  border: 1px solid #ffb020 !important;
  box-shadow: 0 0 18px 2px rgba(255, 176, 32, 0.55) !important;
  text-shadow: none !important;
}

.btn {
  background: rgba(15, 23, 42, 0.4) !important;
  border: 1px solid rgba(34, 211, 238, 0.4) !important;
  color: #22d3ee !important;
}
.btn:hover, .nav button:hover {
  background: rgba(34, 211, 238, 0.12) !important;
  box-shadow: 0 0 14px 1px rgba(34, 211, 238, 0.35) !important;
}

/* Crisp typography: pure white primary, soft silver secondary, no muddy shadows */
h1, h2, h3, .value, .big, b, strong {
  color: #ffffff !important;
  text-shadow: none !important;
}
.label, .muted, small, p {
  color: #b9c2d0 !important;
  text-shadow: none !important;
}

.app, .main, #pages, .page { background: transparent !important; }

/* Main panels: enough opacity for legibility, with the image still visible. */
.sidebar, .card, .cart, .table-card, .kcol, .ticket,
.menu-category-block, .menu-item-row, .product, .pizza-menu-card,
.build-burger-card, .build-step, .recipe-box, .modalbox, .auth-box,
.ops-status, .dashboard-table, .table-wrap, .pnl-fallback, .toast {
  background: var(--fh-glass) !important;
  
  
  border: 1px solid var(--fh-edge) !important;
  border-image: none !important;
  border-radius: 17px !important;
  box-shadow:
    0 14px 36px rgba(0, 0, 0, .34),
    inset 0 1px 0 rgba(255, 255, 255, .075) !important;
  color: var(--fh-copy) !important;
}
.sidebar {
  background: rgba(7, 13, 25, .91) !important;
  border-radius: 0 18px 18px 0 !important;
  border-left: 0 !important;
}
.cart { background: rgba(7, 13, 25, .88) !important; }
.modal { background: rgba(1, 5, 13, .72) !important; }
.auth-screen {
  background: rgba(3, 8, 19, .82) !important;
  
  
}

/* Table surfaces and separators. */
.table-wrap, .dashboard-table { overflow: auto; }
.data, .data tbody, .data tr, .data td { background: transparent !important; }
.data th, .dashboard-table .data thead th {
  background: rgba(4, 9, 18, .70) !important;
  color: #d4deec !important;
  border-bottom: 1px solid rgba(255,255,255,.15) !important;
}
.data td {
  color: #f1f5fb !important;
  border-bottom: 1px solid rgba(255,255,255,.10) !important;
}
.dashboard-table .data tbody tr:nth-child(even) { background: rgba(255,255,255,.035) !important; }
.dashboard-table .data tbody tr:hover { background: rgba(255,189,74,.10) !important; }
.menu-category-head, .pos-category-title {
  background: rgba(5, 11, 22, .58) !important;
  border-color: var(--fh-edge) !important;
}

/* High-contrast typography. */
body, .main, .card, .cart, .product, .table-card, .ticket,
.modalbox, .auth-box, .menu-item-row, .menu-category-block { color: var(--fh-copy) !important; }
h1, h2, h3, .top h1, .value, .big, b, strong,
.mi-name, .pizza-card-name, .payment-donut-center b { color: #ffffff !important; text-shadow: none !important; }
p, small, .muted, .label, .top p, .data th, .pnl-subtitle,
.payment-item .p-label, .payment-item .p-percent { color: var(--fh-muted) !important; }
.price {
  background: transparent !important;
  color: var(--fh-gold) !important;
  border: 0 !important;
  box-shadow: none !important;
  text-shadow: none !important;
}

/* Inputs, selectors and notes. */
.input, .select, textarea,
.build-option, .cat-arrow, .recipe-empty {
  background: rgba(5, 11, 22, .82) !important;
  color: #f7f9fd !important;
  border: 1px solid rgba(225, 235, 250, .22) !important;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.24) !important;
}
.input::placeholder, textarea::placeholder { color: #aab7ca !important; opacity: 1; }
.input:focus, .select:focus, textarea:focus {
  border-color: rgba(255, 189, 74, .88) !important;
  box-shadow: 0 0 0 3px rgba(255, 189, 74, .16) !important;
  outline: none !important;
}
.nav button {
  background: rgba(255,255,255,.045) !important;
  color: #edf3fb !important;
  border: 1px solid transparent !important;
}
.nav button:hover { background: rgba(255,255,255,.10) !important; color: #fff !important; }
.nav button.active, .cat.active {
  background: #ffbd4a !important;
  color: #17130b !important;
  border: 1px solid rgba(255,189,74,.95) !important;
  box-shadow: 0 5px 18px rgba(255,189,74,.20) !important;
}
.cat { background: rgba(7, 14, 27, .78) !important; color: #eef3fa !important; }
.btn {
  background: rgba(12, 21, 37, .82) !important;
  color: #eff5ff !important;
  border: 1px solid rgba(220, 232, 250, .22) !important;
  box-shadow: 0 5px 14px rgba(0,0,0,.18) !important;
}
.btn:hover { background: rgba(35, 52, 76, .92) !important; border-color: rgba(255,255,255,.34) !important; }
.btn.primary { background: #ffbd4a !important; color: #211705 !important; border-color: #ffbd4a !important; }
.btn.good { background: rgba(13, 91, 58, .92) !important; color: #d9ffeb !important; border-color: rgba(88,220,155,.55) !important; }
.btn.danger { background: rgba(112, 29, 39, .90) !important; color: #ffe3e6 !important; border-color: rgba(255,125,140,.48) !important; }
.btn.blue { background: rgba(25, 67, 112, .92) !important; color: #e2f0ff !important; border-color: rgba(112,177,255,.46) !important; }

/* Operational modules and readable data accents. */
.ops-status .ops-copy b { color: #fff !important; }
.payment-donut:after { background: rgba(7, 13, 25, .96) !important; }
.payment-donut-center span { color: #c2ccdc !important; }
.progress { background: rgba(255,255,255,.13) !important; }
.ticket li { color: #e4ebf5 !important; }
.reorder-banner { background: rgba(94, 61, 13, .68) !important; color: #fff4d6 !important; border-color: rgba(255,189,74,.55) !important; }
.customer-found { background: rgba(13, 91, 58, .72) !important; color: #e1ffed !important; border-color: rgba(88,220,155,.48) !important; }
.customer-new { background: rgba(30, 45, 65, .78) !important; color: #e9eff8 !important; border-color: rgba(220,232,250,.22) !important; }

    background:linear-gradient(145deg,rgba(43,58,79,.7),rgba(12,21,36,.88))!important;
    color:#eaf0fa!important;
    border:1px solid rgba(225,237,255,.17)!important;
  }
  .btn.primary,.btn.good,.btn.danger,.btn.blue{border:1px solid rgba(255,255,255,.13)!important}
  .cart-line{border-bottom:1px solid rgba(232,240,255,.13)!important}
  .cart .totals{border-top:1px solid rgba(232,240,255,.18)!important}
  .cart .total{color:#ffcb70!important}

  /* Frosted floating controls. These are the only surfaces using backdrop blur. */
  #mobileBottomNav{
    background:rgba(5,11,22,.76)!important;
    border-top:1px solid rgba(233,242,255,.18)!important;
    box-shadow:0 -10px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)!important;
    -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
    backdrop-filter:blur(18px) saturate(145%)!important;
  }
  #mobileBottomNav button.active{
    background:linear-gradient(145deg,rgba(255,189,74,.2),rgba(255,189,74,.08))!important;
    border-color:rgba(255,189,74,.34)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
  }
  #mobileCartBar{
    background:linear-gradient(145deg,rgba(25,39,60,.88),rgba(7,14,27,.84))!important;
    border:1px solid rgba(235,243,255,.22)!important;
    box-shadow:0 12px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.09)!important;
    -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
    backdrop-filter:blur(18px) saturate(145%)!important;
  }
  .pos .cart{
    background:linear-gradient(155deg,rgba(18,31,51,.94),rgba(5,11,23,.93))!important;
    border:1px solid rgba(234,243,255,.23)!important;
    box-shadow:0 -18px 48px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.09)!important;
    -webkit-backdrop-filter:blur(22px) saturate(145%)!important;
    backdrop-filter:blur(22px) saturate(145%)!important;
  }
  #mobileCartScrim{
    background:rgba(1,5,13,.62)!important;
    -webkit-backdrop-filter:blur(5px)!important;
    backdrop-filter:blur(5px)!important;
  }
  .modalbox{
    background:linear-gradient(150deg,rgba(18,31,51,.96),rgba(5,11,23,.96))!important;
    border:1px solid rgba(234,243,255,.22)!important;
    box-shadow:0 18px 55px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08)!important;
    -webkit-backdrop-filter:blur(20px) saturate(140%)!important;
    backdrop-filter:blur(20px) saturate(140%)!important;
  }
  .modal{background:rgba(0,0,0,.58)!important}
  .top{padding-top:2px}
  .section-title{gap:8px;flex-wrap:wrap}
  .filters>*{min-width:0;max-width:100%}
}
@media(max-width:560px){
  .main{padding-left:11px!important;padding-right:11px!important}
  .pos-category-items{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .product{min-height:122px!important;padding:10px!important}
  .product .row{flex-wrap:wrap}
  .pos>div>.card .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pos>div>.card .filters>*{width:100%;min-width:0}
  .cart .actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));}
  .cart .actions .btn:last-child:nth-child(3){grid-column:1/-1}
  .mobile-cart-summary{padding-left:2px}
}
@media(max-width:360px){
  .main{padding-left:8px!important;padding-right:8px!important}
  .pos-category-items{gap:7px}
  .product{padding:8px!important}
  .product b{font-size:12px!important}
  #mobileCartBar button{min-width:112px!important;padding-inline:8px!important}
}
@media(orientation:landscape) and (max-width:800px){
  .main{padding-bottom:calc(164px + env(safe-area-inset-bottom))!important}
  .pos .cart{height:94vh!important;height:94dvh!important;max-height:calc(100dvh - env(safe-area-inset-top) - 6px)!important}
}
@media(prefers-reduced-transparency:reduce){
  #mobileBottomNav,#mobileCartBar,.pos .cart,.modalbox,#mobileCartScrim{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background:#101a2b!important;
  }
}



/* ===== Feeling Hungry: supplied devotional wallpaper + lightweight glass UI ===== */
:root{
  --fh-glass:rgba(8,15,29,.70);
  --fh-glass-strong:rgba(6,12,24,.82);
  --fh-glass-soft:rgba(15,25,43,.62);
  --fh-edge:rgba(229,238,255,.20);
  --fh-gold:#ffbd4a;
}
html{background:#070c16!important;}
body{
  background:transparent!important;
  background-image:none!important;
  position:relative;
  isolation:isolate;
  color:#f7f9fd!important;
}
#fhWallpaperLayer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(4,8,17,.52) 0%,rgba(5,10,20,.61) 48%,rgba(4,9,18,.78) 100%),
    var(--fh-wallpaper);
  background-position:center center,center center;
  background-repeat:no-repeat,no-repeat;
  background-size:cover,cover;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
}
.app{position:relative;z-index:1;background:transparent!important;}
.main,.page,.section{background:transparent!important;}
.sidebar,.card,.cart,.table-card,.kcol,.ticket,.menu-category-block,.menu-item-row,
.product,.pizza-menu-card,.build-burger-card,.build-step,.recipe-box,.modalbox,.auth-box,
.ops-status,.dashboard-table,.pnl-fallback,.toast,.table-detail-card,.table-detail-counts span{
  background:rgba(8,15,29,.68)!important;
  border:1px solid var(--fh-edge)!important;
  border-image:none!important;
  box-shadow:0 9px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)!important;
}
.sidebar,.card,.table-card,.kcol,.ticket,.menu-category-block,.pizza-menu-card,
.build-burger-card,.modalbox,.auth-box,.ops-status{
  -webkit-backdrop-filter:blur(10px) saturate(125%)!important;
  backdrop-filter:blur(10px) saturate(125%)!important;
}
.product,.menu-item-row,.build-step,.recipe-box,.dashboard-table{
  background:rgba(8,15,29,.64)!important;
}
.input,.select,textarea,.build-option,.cat-arrow,.recipe-empty{
  background:rgba(5,11,22,.74)!important;
  border-color:rgba(255,255,255,.20)!important;
  color:#fff!important;
}
.btn{border-color:rgba(255,255,255,.18)!important;}
.btn:not(.primary):not(.good):not(.danger):not(.blue){
  background:rgba(13,22,38,.66)!important;
  color:#e9f0fb!important;
}
#mobileBottomNav,#mobileCartBar{
  background:rgba(5,11,22,.76)!important;
  border-color:rgba(255,255,255,.19)!important;
  -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
  backdrop-filter:blur(18px) saturate(145%)!important;
}
#mobileCartBar{box-shadow:0 10px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07)!important;}
@media(max-width:800px){
  .main{background:transparent!important;}
  .card,.table-card,.kcol,.ticket,.menu-category-block,.pizza-menu-card,.modalbox{
    background:rgba(7,14,27,.70)!important;
  }
  .product,.menu-item-row{background:rgba(7,14,27,.72)!important;}
  .pos .cart{
    background:rgba(6,12,24,.86)!important;
    -webkit-backdrop-filter:blur(16px) saturate(130%)!important;
    backdrop-filter:blur(16px) saturate(130%)!important;
  }
  #mobileCartScrim{background:rgba(0,0,0,.48)!important;}
}
@media(prefers-reduced-transparency:reduce){
  #fhWallpaperLayer{opacity:.42;}
  .sidebar,.card,.cart,.table-card,.kcol,.ticket,.menu-category-block,.menu-item-row,
  .product,.pizza-menu-card,.build-burger-card,.build-step,.recipe-box,.modalbox,.auth-box,
  .ops-status,.dashboard-table,.toast{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background:rgba(7,13,25,.94)!important;
  }
}

#fhWallpaperLayer{
  background-image:
    linear-gradient(180deg,rgba(3,7,16,.12) 0%,rgba(4,9,18,.22) 48%,rgba(4,8,16,.34) 100%),
    var(--fh-wallpaper)!important;
  background-position:center 34%,center 34%!important;
  background-size:cover,cover!important;
  opacity:1!important;
}
@media(max-width:800px){
  /* Keep the supplied photo visible between and beneath the translucent UI. */
  #fhWallpaperLayer{
    background-image:
      linear-gradient(180deg,rgba(2,6,14,.08) 0%,rgba(3,8,17,.18) 52%,rgba(3,8,17,.30) 100%),
      var(--fh-wallpaper)!important;
    background-position:center 32%,center 32%!important;
    background-size:cover,cover!important;
    filter:saturate(1.10) brightness(1.06);
  }
  .main,#pages,.page,.page.active{background:transparent!important;}
  .card,.table-card,.kcol,.ticket,.menu-category-block,.pizza-menu-card,.modalbox,
  .build-burger-card,.ops-status,.table-detail-card,.menu-item-row,.product,
  .build-step,.recipe-box,.dashboard-table,.table-wrap,.pnl-fallback{
    background:rgba(7,14,27,.39)!important;
    border:1px solid rgba(255,255,255,.27)!important;
    border-image:none!important;
    box-shadow:0 9px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12)!important;
    -webkit-backdrop-filter:blur(15px) saturate(150%)!important;
    backdrop-filter:blur(15px) saturate(150%)!important;
  }
  .product,.menu-item-row,.build-step,.recipe-box,.dashboard-table{
    background:rgba(7,14,27,.32)!important;
  }
  .pos .cart{
    background:rgba(6,12,24,.65)!important;
    border:1px solid rgba(255,255,255,.30)!important;
    -webkit-backdrop-filter:blur(19px) saturate(155%)!important;
    backdrop-filter:blur(19px) saturate(155%)!important;
  }
  #mobileBottomNav,#mobileCartBar{
    background:rgba(5,11,22,.55)!important;
    border:1px solid rgba(255,255,255,.27)!important;
    border-top-color:rgba(255,255,255,.36)!important;
    -webkit-backdrop-filter:blur(22px) saturate(160%)!important;
    backdrop-filter:blur(22px) saturate(160%)!important;
    box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)!important;
  }
  #mobileCartScrim{background:rgba(0,0,0,.34)!important;}
  .input,.select,textarea,.build-option,.cat-arrow,.recipe-empty{
    background:rgba(4,10,20,.52)!important;
    border-color:rgba(255,255,255,.27)!important;
    -webkit-backdrop-filter:blur(10px) saturate(140%)!important;
    backdrop-filter:blur(10px) saturate(140%)!important;
  }
  .btn:not(.primary):not(.good):not(.danger):not(.blue){
    background:rgba(10,18,32,.48)!important;
    border-color:rgba(255,255,255,.24)!important;
  }
}
@media(prefers-reduced-transparency:reduce){
  /* Respect the OS accessibility setting; retain a little wallpaper contrast. */
  #fhWallpaperLayer{opacity:.72!important;}
}


/* Bluetooth printer settings */
.printer-status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:99px;background:rgba(148,163,184,.14);border:1px solid rgba(148,163,184,.25);font-size:12px;font-weight:800;color:#dbeafe}
.printer-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#94a3b8}
.printer-status.connected:before{background:#22c55e;box-shadow:0 0 10px #22c55e}
.printer-status.connecting:before{background:#f59e0b;animation:printerPulse 1s infinite}
@keyframes printerPulse{50%{opacity:.3}}
.printer-settings-grid{display:grid;gap:12px}
.printer-info{padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(15,23,42,.35);color:#dbeafe;font-size:12px;line-height:1.6}
.printer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.printer-actions .btn{flex:1;min-width:135px}
.permission-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.permission-row:last-child{border-bottom:0}
@media(max-width:520px){.printer-actions .btn{min-width:100%}}

/* Stability patch: keep the mobile cart sheet crisp without blurring the document. */
#mobileCartScrim{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

 #mobileCartScrim{background:rgba(1,5,13,.38)!important}
 .pos .cart,.modalbox{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
 html.mobile-cart-visible,body.mobile-cart-visible{overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important}
}

    padding-top:8px!important;
    background:#070c16!important;
  }
  .pos .cart .actions{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:8px!important;
    width:100%!important;
    margin-top:9px!important;
    padding:0 0 2px!important;
    background:#070c16!important;
  }
  .pos .cart .actions .btn{
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    width:100%!important;
    min-width:0!important;
    min-height:44px!important;
    margin:0!important;
    padding:10px 7px!important;
    white-space:normal!important;
    overflow-wrap:anywhere!important;
    font-size:12px!important;
    line-height:1.25!important;

  .pos .cart .actions .btn.primary{grid-column:1/-1!important}
  .pos .cart .mobile-cart-close{z-index:3!important;flex:0 0 auto!important}

<style id="fh-mobile-cart-portal-layer">
@media (max-width:800px){
  /* Top-level portal layer: not a child of .app, .main, .page or .pos. */
  #mobileCartSheet{
    position:fixed!important;inset:0!important;z-index:130!important;
    display:flex!important;align-items:flex-end!important;justify-content:center!important;
    pointer-events:none!important;visibility:hidden!important;overflow:hidden!important;
    isolation:isolate!important;
  }
  #mobileCartSheet:has(.cart.mobile-cart-open){
    pointer-events:auto!important;visibility:visible!important;
  }
  #mobileCartSheet .cart{
    position:absolute!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;
    width:100%!important;height:min(88dvh,760px)!important;max-height:calc(100dvh - env(safe-area-inset-top) - 8px)!important;
    min-height:260px!important;max-width:none!important;margin:0!important;box-sizing:border-box!important;
    display:flex!important;flex-direction:column!important;overflow:hidden!important;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom))!important;
    border:1px solid rgba(255,255,255,.18)!important;border-bottom:0!important;border-radius:22px 22px 0 0!important;
    background:#070c16!important;background-image:none!important;color:#f4f7fc!important;
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    box-shadow:0 -18px 55px rgba(0,0,0,.68)!important;isolation:isolate!important;
    transform:translate3d(0,110%,0)!important;visibility:hidden!important;pointer-events:none!important;
    transition:transform .24s ease,visibility 0s linear .24s!important;
  }
  #mobileCartSheet .cart.mobile-cart-open{
    transform:translate3d(0,0,0)!important;visibility:visible!important;pointer-events:auto!important;
    transition:transform .24s ease,visibility 0s!important;
  }
  #mobileCartSheet .cart .section-title,#mobileCartSheet .cart>.muted,
  #mobileCartSheet .cart .totals,#mobileCartSheet .cart .actions{flex:0 0 auto!important;flex-shrink:0!important;min-width:0!important;}
  #mobileCartSheet .cart .section-title{padding-right:48px!important;min-height:42px!important;}
  #mobileCartSheet .cart .cart-items{flex:1 1 auto!important;min-height:0!important;max-height:none!important;
    overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;}
  #mobileCartSheet .cart .totals,#mobileCartSheet .cart .actions{background:#070c16!important;position:relative!important;z-index:2!important;}
  #mobileCartSheet .cart .actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:100%!important;margin-top:9px!important;padding-bottom:2px!important;}
  #mobileCartSheet .cart .actions .btn{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;min-height:46px!important;margin:0!important;padding:9px 7px!important;white-space:normal!important;overflow-wrap:anywhere!important;font-size:12px!important;line-height:1.25!important;}
  #mobileCartSheet .cart .actions .btn.primary{grid-column:1/-1!important;}
  #mobileCartSheet .cart .mobile-cart-close{position:absolute!important;top:10px!important;right:12px!important;z-index:5!important;}
  #mobileCartScrim{z-index:125!important;background:rgba(0,0,0,.68)!important;}
  #mobileCartScrim.visible{opacity:1!important;visibility:visible!important;pointer-events:auto!important;}
  html.mobile-cart-visible,body.mobile-cart-visible{overflow:hidden!important;overscroll-behavior:none!important;}
}
</style>

// ---------------- Automatic Firebase anonymous session (no POS login screen) ----------------
// The POS receives a Firebase anonymous UID automatically. Firestore rules
// authorize only the registered POS-device UID; Digital Menu customer UIDs
// remain restricted to public menu reads and their own order requests.
let firebaseInitPromise = null;
let firestoreStartupPromise = null;
let firestoreUnsubscribers = [];
let firebaseDeviceUid = '';
let firebaseServerSnapshotSeen = false;
let firebaseSetupComplete = false;
let firebaseListenerError = null;
let firebaseConnectionTimer = null;
let firebaseWaitTimedOut = false;
let latestMenuSnapshot = null;
let latestOnlineOrderRequestsSnapshot = null;

function stopFirestoreListeners() {
  firestoreUnsubscribers.forEach(unsubscribe => {
    try { unsubscribe(); } catch (error) { console.warn('Listener cleanup failed', error); }
  });
  firestoreUnsubscribers = [];
}

function describeFirebaseError(error) {
  const code = String(error?.code || '').toLowerCase();
  const detail = String(error?.message || error || 'Unknown Firebase error');
  if (code.includes('permission-denied')) {
    return 'Firestore denied access for this POS device. Check the anonymous device UID and your existing Firestore security rules. Do not make the database public. Details: ' + detail;
  }
  if (code.includes('unauthenticated')) {
    return 'Firebase authentication is not available for this browser session. Confirm Anonymous sign-in is enabled in Firebase Authentication. Details: ' + detail;
  }
  if (code.includes('failed-precondition')) {
    return 'A Firestore query or database precondition failed. Check the error details and any required Firestore index. Details: ' + detail;
  }
  if (code.includes('unavailable') || code.includes('deadline-exceeded') || code.includes('network')) {
    return 'Firestore cannot currently reach the server. Check the internet connection and open this POS from its HTTPS hosting URL. Details: ' + detail;
  }
  return detail;
}

function refreshFirebaseConnectionStatus() {
  if (firebaseListenerError) {
    firebaseStatus = 'error';
    firebaseError = describeFirebaseError(firebaseListenerError);
  } else if (firebaseServerSnapshotSeen && firebaseSetupComplete) {
    firebaseStatus = 'connected';
    firebaseError = '';
    firebaseWaitTimedOut = false;
    if (firebaseConnectionTimer) { clearTimeout(firebaseConnectionTimer); firebaseConnectionTimer = null; }
  } else {
    firebaseStatus = 'connecting';
  }
}

function subscribeSnapshot(ref, onNext, onError) {
  const unsubscribe = fs.onSnapshot(
    ref,
    { includeMetadataChanges: true },
    snapshot => {
      if (snapshot.metadata?.fromCache === false) {
        firebaseServerSnapshotSeen = true;
        refreshFirebaseConnectionStatus();
      } else if (firebaseStatus === 'connected') {
        firebaseStatus = 'connecting';
        firebaseError = 'Waiting for Firestore to confirm the server connection…';
      }

      try {
        onNext(snapshot);
      } catch (callbackError) {
        console.error('Firestore snapshot handler failed:', callbackError);
        connErr(callbackError);
      }
      render();
    },
    error => {
      if (typeof onError === 'function') onError(error);
      else connErr(error);
    }
  );
  firestoreUnsubscribers.push(unsubscribe);
  return unsubscribe;
}

async function waitForInitialAuthState() {
  return new Promise((resolve, reject) => {
    let unsubscribe = null;
    unsubscribe = fa.onAuthStateChanged(auth, user => {
      if (unsubscribe) unsubscribe();
      resolve(user || null);
    }, error => {
      if (unsubscribe) unsubscribe();
      reject(error);
    });
  });
}

async function ensureFirebaseInit() {
  if (!firebaseInitPromise) firebaseInitPromise = initFirebase();
  return firebaseInitPromise;
}

async function initFirebase() {
  try {
    if (location.protocol === 'file:') {
      throw new Error('This POS is open as a local file. Firebase live sync requires the hosted HTTPS URL. Upload/deploy the POS to Firebase Hosting, then open that HTTPS address on the phones.');
    }

    const appMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
    fs = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
    fa = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');

    const existingApp = appMod.getApps().find(item => item.name === '[DEFAULT]');
    const app = existingApp || appMod.initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    auth = fa.getAuth(app);

    // Wait for persisted anonymous auth to restore; create it only when absent.
    let user = await waitForInitialAuthState();
    if (!user) {
      const credential = await fa.signInAnonymously(auth);
      user = credential.user;
    }

    state.authUser = user;
    firebaseDeviceUid = user.uid;
    console.info('[POS Firebase] Browser origin:', location.origin);
    console.info('[POS Firebase] Anonymous POS device UID:', firebaseDeviceUid);
    await startAuthenticatedFirestore();
  } catch (error) {
    console.error('Firebase initialization error:', error);
    firebaseStatus = 'error';
    firebaseError = error?.message || String(error);
    render();
  }
}

async function startAuthenticatedFirestore() {
  if (firestoreStartupPromise) return firestoreStartupPromise;

  firestoreStartupPromise = (async () => {
    firebaseStatus = 'connecting';
    firebaseError = '';
    firebaseServerSnapshotSeen = false;
    firebaseSetupComplete = false;
    firebaseListenerError = null;
    firebaseWaitTimedOut = false;
    if (firebaseConnectionTimer) clearTimeout(firebaseConnectionTimer);
    firebaseConnectionTimer = setTimeout(() => {
      if (firebaseStatus !== 'connected' && !firebaseListenerError) {
        firebaseWaitTimedOut = true;
        if (firebaseServerSnapshotSeen) {
          firebaseError = 'Firestore has reached this browser, but the POS setup writes are still pending. Open browser Developer Tools → Console and check for permission-denied or failed-precondition errors.';
        } else if (location.protocol === 'file:') {
          firebaseError = 'This is a local HTML file. Firebase live sync requires HTTPS hosting or a local web server such as http://localhost:8000.';
        } else if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && location.protocol !== 'https:') {
          firebaseError = 'This page is not using HTTPS. Open the deployed HTTPS URL or use http://localhost for local testing.';
        } else {
          firebaseError = 'No server-confirmed Firestore snapshot has arrived. Check internet access, Firebase Console → Firestore Database, Anonymous Authentication, browser extensions/firewall, and the browser Console for the exact error.';
        }
        render();
      }
    }, 20000);
    latestMenuSnapshot = null;
    latestOnlineOrderRequestsSnapshot = null;
    render();

    try {
      // Attach real-time listeners first. Previously, several migration and
      // catalogue writes ran before listeners were registered; a denied or
      // slow seed write could therefore leave the POS showing stale data.
      stopFirestoreListeners();
      attachListeners();
      startOnlineKOTPrintRetry();

      // Preserve the existing data migration and seed behavior. It now runs
      // after listeners are active, so a setup/write problem is diagnosable
      // without silently preventing live subscriptions from starting.
      console.info('[POS Firebase] Live listeners registered; running data setup.');
      await migrateLegacySeedMarkers();
      await seedIfEmpty('menu', SEED.menu);
      await ensureFeelingHungryMenuCatalog();
      await seedIfEmpty('tables', SEED.tables);
      await seedIfEmpty('inventory', SEED.inventory);
      await seedIfEmpty('suppliers', SEED.suppliers);
      await seedIfEmpty('staff', SEED.staff);
      await seedSettings();

      firebaseSetupComplete = true;
      if (latestMenuSnapshot && latestMenuSnapshot.metadata?.fromCache === false) {
        syncPublicMenuFromPOSSnapshot(latestMenuSnapshot);
      }
      if (latestOnlineOrderRequestsSnapshot) {
        latestOnlineOrderRequestsSnapshot.docs.forEach(doc => {
          if ((doc.data() || {}).status === 'pending') processOnlineMenuRequest(doc.id);
        });
      }

      refreshFirebaseConnectionStatus();
      schedulePendingOnlineKOTPrints();
      console.info('[POS Firebase] Data setup complete. Waiting for/using server-confirmed snapshots.');
      render();
    } catch (error) {
      console.error('[POS Firebase] Startup data setup failed:', error);
      firestoreStartupPromise = null;
      firebaseListenerError = error;
      firebaseStatus = 'error';
      firebaseError = describeFirebaseError(error);
      render();
    }
  })();

  return firestoreStartupPromise;
}

async function reconnectFirebase() {
  try {
    if (!db || !auth) {
      firebaseInitPromise = null;
      await ensureFirebaseInit();
      return;
    }
    stopFirestoreListeners();
    firestoreStartupPromise = null;
    firebaseServerSnapshotSeen = false;
    firebaseSetupComplete = false;
    firebaseListenerError = null;
    firebaseWaitTimedOut = false;
    if (firebaseConnectionTimer) clearTimeout(firebaseConnectionTimer);
    firebaseConnectionTimer = setTimeout(() => {
      if (firebaseStatus !== 'connected' && !firebaseListenerError) {
        firebaseWaitTimedOut = true;
        if (firebaseServerSnapshotSeen) {
          firebaseError = 'Firestore has reached this browser, but the POS setup writes are still pending. Open browser Developer Tools → Console and check for permission-denied or failed-precondition errors.';
        } else if (location.protocol === 'file:') {
          firebaseError = 'This is a local HTML file. Firebase live sync requires HTTPS hosting or a local web server such as http://localhost:8000.';
        } else if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && location.protocol !== 'https:') {
          firebaseError = 'This page is not using HTTPS. Open the deployed HTTPS URL or use http://localhost for local testing.';
        } else {
          firebaseError = 'No server-confirmed Firestore snapshot has arrived. Check internet access, Firebase Console → Firestore Database, Anonymous Authentication, browser extensions/firewall, and the browser Console for the exact error.';
        }
        render();
      }
    }, 20000);
    latestMenuSnapshot = null;
    latestOnlineOrderRequestsSnapshot = null;
    firebaseStatus = 'connecting';
    firebaseError = '';
    render();
    if (!auth.currentUser) {
      const credential = await fa.signInAnonymously(auth);
      state.authUser = credential.user;
    } else {
      state.authUser = auth.currentUser;
    }
    firebaseDeviceUid = state.authUser?.uid || '';
    await startAuthenticatedFirestore();
  } catch (error) {
    console.error('Firebase reconnect failed:', error);
    firebaseStatus = 'error';
    firebaseError = error?.message || String(error);
    render();
  }
}

async function migrateLegacySeedMarkers(){
 // Move only the five collection markers used by this POS to the branded namespace.
 // Legacy prefixes are assembled so no former brand string remains in the source.
 const oldPrefixes=[['seed_','hide','out_'].join(''),'seed_'];
 const newPrefix='seed_feeling_hungry_';
 const collections=['menu','tables','inventory','suppliers','staff'];
 await Promise.all(collections.map(async name=>{
  const targetRef=fs.doc(db,'appMeta',newPrefix+name);
  const [targetSnap,...oldSnaps]=await Promise.all([
   fs.getDoc(targetRef),
   ...oldPrefixes.map(prefix=>fs.getDoc(fs.doc(db,'appMeta',prefix+name)))
  ]);
  let targetExists=targetSnap.exists();
  for(let i=0;i<oldSnaps.length;i++){
   const oldSnap=oldSnaps[i];
   if(!oldSnap.exists()) continue;
   if(!targetExists){
    await fs.setDoc(targetRef,oldSnap.data()||{initialized:true},{merge:true});
    targetExists=true;
   }
   await fs.deleteDoc(fs.doc(db,'appMeta',oldPrefixes[i]+name));
  }
 }));
}
async function seedIfEmpty(name, items){
 // Do not reseed just because a collection becomes empty.
 // Otherwise deleting the last item makes it come back after refresh.
 const markerRef = fs.doc(db, 'appMeta', 'seed_feeling_hungry_'+name);
 const markerSnap = await fs.getDoc(markerRef);
 if(markerSnap.exists()) return;

 const snap = await fs.getDocs(fs.collection(db, name));
 if(snap.empty){
  for(const item of items){ await fs.addDoc(fs.collection(db, name), item); }
 }
 // This collection has now been initialized. Future refreshes will not
 // recreate records that the user intentionally added or deleted.
 await fs.setDoc(markerRef, {initialized:true, initializedAt:fs.serverTimestamp()});
}

 async function ensureFeelingHungryMenuCatalog(){
  const ref=fs.doc(db,'settings','main');
  const snap=await fs.getDoc(ref);
  const data=snap.exists()?(snap.data()||{}):{};
  const existing=await fs.getDocs(fs.collection(db,'menu'));
  if(data.menuCatalogVersion!==FEELING_HUNGRY_MENU_VERSION){
    const docsByName=new Map();
    existing.docs.forEach(doc=>{
      const name=String(doc.data()?.name||'').trim().toLocaleLowerCase();
      if(name && !docsByName.has(name)) docsByName.set(name,doc);
    });
    const pizzaAliasBases={
      'cheese corn pizza':'cheesy corn pizza',
      'cheese mushroom pizza':'cheesy mushroom pizza',
      'cheese tomato pizza':'cheesy tomato pizza',
      'cheesy margherita pizza':'margherita pizza',
      'tandoori paneer pizza':'tandoori paneer tikka pizza',
      'achari pizza':'spicy achari pizza',
      'veg paradise pizza':'veg deluxe pizza',
      'makhani pizza':'paneer makhni pizza'
    };
    const aliasNames={
      'creamy white sauce pasta':'white sauce pasta',
      'tandoori paneer pasta':'paneer tikka pasta',
      'corn kurkure momos':'kurkure cheese corn momos',
      'kurkure cheese momos':'kurkure cheese corn momos'
    };
    const normalized = value => String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase();
    for(const item of FEELING_HUNGRY_MENU_CLEAN){
      const nameKey=normalized(item.name);
      let match=docsByName.get(nameKey);
      if(!match){
        let base=item.name;
        let suffix='';
        const sizeMatch=base.match(/\s-\s(Regular|Medium|Large)$/i);
        if(sizeMatch){suffix=' - '+sizeMatch[1];base=base.replace(/\s-\s(Regular|Medium|Large)$/i,'');}
        const canonicalBase=normalized(base);
        const legacyPizzaBase=Object.keys(pizzaAliasBases).find(oldBase=>normalized(pizzaAliasBases[oldBase])===canonicalBase);
        const legacyAlias=Object.keys(aliasNames).find(oldName=>normalized(aliasNames[oldName])===canonicalBase);
        const aliasKey=legacyPizzaBase ? normalized(legacyPizzaBase+suffix) : legacyAlias ? normalized(legacyAlias) : '';
        if(aliasKey) match=docsByName.get(aliasKey);
      }
      const patch={name:item.name,cat:item.cat,price:item.price,emoji:item.emoji,station:item.station};
      if(Array.isArray(item.items)) patch.items=[...item.items];
      if(match){
        await fs.updateDoc(match.ref,patch);
        docsByName.set(nameKey,match);
      }else{
        const added=await fs.addDoc(fs.collection(db,'menu'),{...item,...(Array.isArray(item.items)?{items:[...item.items]}:{})});
        docsByName.set(nameKey,{id:added.id,ref:added,data:()=>item});
      }
    }
  }else if(existing.empty){
    for(const item of FEELING_HUNGRY_MENU_CLEAN) await fs.addDoc(fs.collection(db,'menu'),{...item});
  }
  await fs.setDoc(ref,{...state.settings,...data,menuCategories:FEELING_HUNGRY_CATEGORY_ORDER,menuCatalogVersion:FEELING_HUNGRY_MENU_VERSION,catalogMigratedAt:fs.serverTimestamp()},{merge:true});
}

// Publish a customer-safe catalogue copy directly from the authenticated POS.
// This makes the customer menu available even before the optional menu-mirror
// Cloud Function has run. Internal fields such as cost, sold, and recipe never
// leave the private `menu` collection.
let publicMenuMirrorPrimed = false;
let publicMenuMirrorQueue = Promise.resolve();
const publicMenuMirrorSignatures = new Map();

function publicMenuProjectionFromPOS(docId, data) {
 const price = Number(data.price || 0);
 const displayOrder = Number(data.displayOrder);
 return {
  id: docId,
  name: String(data.name || '').trim(),
  cat: String(data.cat || data.category || 'Other').trim(),
  price: Number.isFinite(price) && price >= 0 ? price : 0,
  emoji: String(data.emoji || ''),
  station: String(data.station || ''),
  description: String(data.description || ''),
  imageUrl: typeof data.imageUrl === 'string' ? data.imageUrl : '',
  active: data.active !== false && data.available !== false,
  available: data.available !== false,
  displayOrder: Number.isFinite(displayOrder) ? displayOrder : 9999
 };
}

async function commitPublicMenuMirrorWrites(writes) {
 for (let i = 0; i < writes.length; i += 400) {
  const batch = fs.writeBatch(db);
  for (const write of writes.slice(i, i + 400)) {
   if (write.type === 'delete') batch.delete(write.ref);
   else batch.set(write.ref, {...write.data, updatedAt: fs.serverTimestamp()}, {merge: true});
  }
  await batch.commit();
 }
}

function syncPublicMenuFromPOSSnapshot(snapshot) {
 publicMenuMirrorQueue = publicMenuMirrorQueue.then(async () => {
  const sourceDocs = snapshot.docs;
  const sourceIds = new Set(sourceDocs.map(doc => doc.id));
  const writes = [];

  if (!publicMenuMirrorPrimed) {
   // First sync: publish every current POS menu item and remove stale public
   // entries left behind by items that were deleted before this POS session.
   const existingPublic = await fs.getDocs(fs.collection(db, 'digitalMenu'));
   for (const doc of sourceDocs) {
    const data = doc.data() || {};
    const projection = publicMenuProjectionFromPOS(doc.id, data);
    if (!projection.name) continue;
    publicMenuMirrorSignatures.set(doc.id, JSON.stringify(projection));
    writes.push({type:'set', ref:fs.doc(db, 'digitalMenu', doc.id), data:projection});
   }
   for (const doc of existingPublic.docs) {
    if (!sourceIds.has(doc.id)) writes.push({type:'delete', ref:doc.ref});
   }
   await commitPublicMenuMirrorWrites(writes);
   publicMenuMirrorPrimed = true;
   console.info(`Published ${sourceDocs.length} menu records to digitalMenu.`);
   return;
  }

  // Subsequent updates: mirror only changed public fields. A POS sale changes
  // `sold`, but that private metric is intentionally not copied to the menu.
  for (const change of snapshot.docChanges()) {
   const doc = change.doc;
   const ref = fs.doc(db, 'digitalMenu', doc.id);
   if (change.type === 'removed') {
    publicMenuMirrorSignatures.delete(doc.id);
    writes.push({type:'delete', ref});
    continue;
   }
   const projection = publicMenuProjectionFromPOS(doc.id, doc.data() || {});
   if (!projection.name) {
    publicMenuMirrorSignatures.delete(doc.id);
    writes.push({type:'delete', ref});
    continue;
   }
   const signature = JSON.stringify(projection);
   if (publicMenuMirrorSignatures.get(doc.id) === signature) continue;
   publicMenuMirrorSignatures.set(doc.id, signature);
   writes.push({type:'set', ref, data:projection});
  }
  await commitPublicMenuMirrorWrites(writes);
 }).catch(error => {
  // Keep the queue alive so a later menu snapshot/reconnect can retry.
  console.error('POS -> Digital Menu catalogue sync failed:', error);
  publicMenuMirrorPrimed = false;
 });
 return publicMenuMirrorQueue;
}

// The POS browser acts as the trusted order processor. This keeps checkout
// working without requiring a separately deployed Cloud Function. The POS
// device UID is allow-listed in firestore.rules; customer browsers can only
// create a request and read their own request status.
const onlineOrderRequestsInFlight = new Set();

function normalizeOnlineTableName(value) {
 const raw = String(value || '').trim().slice(0, 32);
 // Accept common customer-facing labels such as "1", "T1", "T-1" and "Table 1"
 // while storing one consistent table key for Digital Menu, POS, orders and KOTs.
 const numeric = raw.match(/^(?:(?:TABLE|T)[-\s]*)?(\d{1,2})$/i);
 return numeric ? `T-${numeric[1].padStart(2, '0')}` : raw;
}
function sameTableName(a, b) {
 const left = normalizeOnlineTableName(a).toLowerCase();
 const right = normalizeOnlineTableName(b).toLowerCase();
 return !!left && left === right;
}

function onlineTableDocumentId(tableName) {
 const slug = String(tableName).toLowerCase()
   .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 36);
 return `qr-${slug || 'table'}`;
}

async function processOnlineMenuRequest(requestId) {
 const id = String(requestId || '').trim();
 if (!id || !db || !fs || !auth?.currentUser || onlineOrderRequestsInFlight.has(id)) return;
 onlineOrderRequestsInFlight.add(id);
 const requestRef = fs.doc(db, 'onlineOrderRequests', id);

 try {
  const requestSnapshot = await fs.getDoc(requestRef);
  if (!requestSnapshot.exists()) return;
  const incoming = requestSnapshot.data() || {};
  if (incoming.status !== 'pending') return;

  const appendToRequestId = String(incoming.appendToRequestId || '').trim();
  const isAppend = !!appendToRequestId;
  const parentRequestRef = isAppend ? fs.doc(db, 'onlineOrderRequests', appendToRequestId) : null;
  const targetRequestId = isAppend ? appendToRequestId : id;
  const orderRef = fs.doc(db, 'orders', `WEB_${targetRequestId}`);
  // A new KOT is created for each add-on, but the bill/order document remains one record.
  const kotRef = fs.doc(db, 'kots', `WEB_${id}`);
  const shortCode = targetRequestId.replace(/[^a-z0-9]/gi, '').slice(-8).toUpperCase();
  const orderCode = `WEB-${shortCode}`;
  let kotCode = '';
  const sequenceRef = fs.doc(db, 'settings', 'main');
  const now = new Date();
  const localTime = now.toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', hour12:true});
  const localDate = now.toLocaleDateString('en-IN', {timeZone:'Asia/Kolkata'});

  const orderType = String(incoming.orderType || '').toUpperCase();
  if (!['DINE-IN', 'TAKEAWAY'].includes(orderType)) throw new Error('Choose Dine-in or Takeaway.');

  const customerName = sanitizeText(incoming.customerName, 60);
  const customerMobile = String(incoming.customerMobile || '').replace(/\D/g, '').slice(0, 10);
  if (!customerName || !/^\d{10}$/.test(customerMobile)) {
   throw new Error('Customer name and a valid 10-digit mobile number are required.');
  }

  const tableName = orderType === 'DINE-IN' ? normalizeOnlineTableName(incoming.table) : '—';
  if (orderType === 'DINE-IN' && !/^[A-Za-z0-9][A-Za-z0-9 _-]{0,11}$/.test(tableName)) {
   throw new Error('Enter a valid table name.');
  }

  const paymentMethod = String(incoming.paymentMethod || 'Pay at Counter').trim();
  if (!['Cash', 'UPI', 'Pay at Counter'].includes(paymentMethod)) {
   throw new Error('Choose a valid payment method.');
  }

  const rawItems = Array.isArray(incoming.items) ? incoming.items : [];
  if (!rawItems.length || rawItems.length > 30) throw new Error('Order must contain between 1 and 30 item lines.');
  const combined = new Map();
  for (const raw of rawItems) {
   const menuItemId = String(raw?.menuItemId || '').trim();
   const qty = Number(raw?.qty);
   const note = sanitizeText(raw?.note || incoming.specialNotes || '', 200);
   if (!menuItemId || !Number.isInteger(qty) || qty < 1 || qty > 20) {
    throw new Error('One or more order lines are invalid. Refresh the Digital Menu and try again.');
   }
   const line = combined.get(menuItemId) || {menuItemId, qty: 0, note: ''};
   line.qty += qty;
   if (line.qty > 50) throw new Error('The quantity for a menu item is too large.');
   if (note) line.note = [line.note, note].filter(Boolean).join('; ').slice(0, 200);
   combined.set(menuItemId, line);
  }
  const requestItems = [...combined.values()];
  const specialNotes = sanitizeText(incoming.specialNotes || '', 200);

  let tableRef = null;
  if (orderType === 'DINE-IN') {
   const match = await fs.getDocs(fs.query(
    fs.collection(db, 'tables'), fs.where('name', '==', tableName), fs.limit(1)
   ));
   tableRef = match.empty
    ? fs.doc(db, 'tables', onlineTableDocumentId(tableName))
    : match.docs[0].ref;
  }

  const accepted = await fs.runTransaction(db, async transaction => {
   const latestRequest = await transaction.get(requestRef);
   if (!latestRequest.exists() || latestRequest.data()?.status !== 'pending') return false;

   let parentRequest = null;
   let existingOrder = null;
   if (isAppend) {
    const parentSnap = await transaction.get(parentRequestRef);
    const orderSnap = await transaction.get(orderRef);
    if (!parentSnap.exists() || !orderSnap.exists()) throw new Error('The active order could not be found. Please start a new order.');
    parentRequest = parentSnap.data() || {};
    existingOrder = orderSnap.data() || {};
    if (parentRequest.status !== 'accepted' || existingOrder.paymentStatus === 'paid' || String(existingOrder.status || '').toLowerCase() === 'completed') {
     throw new Error('This order has already been settled. Please start a new order.');
    }
    if (parentRequest.createdByUid !== incoming.createdByUid || String(parentRequest.customerMobile || '').replace(/\D/g, '').slice(0,10) !== customerMobile) {
     throw new Error('This add-on does not belong to the active customer session.');
    }
    const parentTable = orderType === 'DINE-IN' ? normalizeOnlineTableName(parentRequest.table) : '—';
    if (String(parentRequest.orderType || '').toUpperCase() !== orderType || parentTable !== tableName) {
     throw new Error('The add-on must use the same order type and table as the active order.');
    }
   }

   const menuSnapshots = [];
   for (const line of requestItems) {
    const menuRef = fs.doc(db, 'menu', line.menuItemId);
    const menuSnapshot = await transaction.get(menuRef);
    if (!menuSnapshot.exists()) throw new Error('A selected menu item is no longer available. Refresh the Digital Menu.');
    const menuItem = menuSnapshot.data() || {};
    if (menuItem.active === false || menuItem.available === false) {
     throw new Error(`${menuItem.name || 'A selected item'} is currently unavailable.`);
    }
    const name = String(menuItem.name || '').trim();
    const price = Number(menuItem.price);
    if (!name || !Number.isFinite(price) || price < 0) throw new Error('A selected menu item has an invalid POS price.');
    menuSnapshots.push({ref:menuRef, data:menuItem, line, name, price});
   }

   let tableSnapshot = null;
   if (tableRef) tableSnapshot = await transaction.get(tableRef);
   const sequenceSnapshot = await transaction.get(sequenceRef);
   const sequenceData = sequenceSnapshot.exists() ? (sequenceSnapshot.data() || {}) : {};
   const existingKotRecords = [...(state.kots || []), ...(state.orders || []).map(order => ({code:order.kotCode}))];
   const nextKotSequence = nextSequenceValue('kotSequence', 'KOT-', 102, sequenceData, existingKotRecords);
   kotCode = formatKotCode(nextKotSequence);

   const addedMenuLines = menuSnapshots.map(({data, line, name, price}) => ({
    id: line.menuItemId,
    name,
    category: String(data.cat || data.category || 'Other').trim(),
    price,
    cost: Number(data.cost || 0),
    qty: line.qty,
    note: line.note || '',
    station: String(data.station || ''),
    lineTotal: price * line.qty
   }));

   let finalMenuLines = addedMenuLines;
   let finalSubtotal = addedMenuLines.reduce((sum, item) => sum + item.lineTotal, 0);
   let finalOrderCode = orderCode;
   let allRequestIds = [id];
   if (isAppend) {
    const merged = new Map();
    (Array.isArray(existingOrder.items) ? existingOrder.items : []).forEach(item => {
     const key = String(item.id || item.menuItemId || '');
     if (key) merged.set(key, {...item, qty:Number(item.qty || 0), lineTotal:Number(item.price || 0) * Number(item.qty || 0)});
    });
    for (const item of addedMenuLines) {
     const previous = merged.get(item.id);
     if (previous) {
      previous.qty += item.qty;
      previous.lineTotal = Number(previous.price || item.price) * previous.qty;
      if (item.note) previous.note = [previous.note, item.note].filter(Boolean).join('; ').slice(0, 200);
     } else merged.set(item.id, {...item});
    }
    finalMenuLines = [...merged.values()];
    finalSubtotal = finalMenuLines.reduce((sum, item) => sum + Number(item.lineTotal || 0), 0);
    finalOrderCode = String(existingOrder.code || orderCode);
    allRequestIds = [...new Set([...(Array.isArray(existingOrder.orderRequestIds) ? existingOrder.orderRequestIds : [appendToRequestId]), id])];
   }

   const serverTimestamp = fs.serverTimestamp();
   const finalNotes = isAppend
    ? [String(existingOrder.specialNotes || '').trim(), specialNotes].filter(Boolean).join('; ').slice(0, 200)
    : specialNotes;

   if (isAppend) {
    transaction.set(orderRef, {
     ...existingOrder,
     total: finalSubtotal,
     subtotal: finalSubtotal,
     items: finalMenuLines,
     specialNotes: finalNotes,
     customerName: sanitizeText(existingOrder.customerName || customerName, 60),
     customerMobile,
     table: tableName,
     orderRequestIds: allRequestIds,
     updatedAt: serverTimestamp
    }, {merge:true});
    const consolidatedRequestItems = new Map();
    (Array.isArray(parentRequest.items) ? parentRequest.items : []).forEach(item => consolidatedRequestItems.set(String(item.menuItemId), {...item, qty:Number(item.qty || 0)}));
    requestItems.forEach(item => {
     const old = consolidatedRequestItems.get(item.menuItemId);
     if (old) { old.qty += item.qty; old.note = [old.note, item.note].filter(Boolean).join('; ').slice(0, 200); }
     else consolidatedRequestItems.set(item.menuItemId, {...item});
    });
    transaction.update(parentRequestRef, {
     items: [...consolidatedRequestItems.values()],
     subtotal: finalSubtotal,
     orderCode: finalOrderCode,
     orderId: orderRef.id,
     childRequestIds: [...new Set([...(Array.isArray(parentRequest.childRequestIds) ? parentRequest.childRequestIds : []), id])],
     specialNotes: finalNotes,
     updatedAt: serverTimestamp
    });
   } else {
    transaction.set(orderRef, {
     code: finalOrderCode,
     kotCode,
     total: finalSubtotal,
     subtotal: finalSubtotal,
     discount: 0,
     tax: 0,
     payment: paymentMethod,
     paymentStatus: 'pending',
     status: 'Pending Payment',
     source: 'online-menu',
     businessAddress: BUSINESS_ADDRESS,
     time: localTime,
     date: localDate,
     type: orderType,
     table: tableName,
     items: finalMenuLines,
     customerName,
     customerMobile,
     cashier: 'Digital Menu',
     specialNotes: finalNotes,
     createdAt: serverTimestamp,
     orderRequestId: id,
     orderRequestIds: [id]
    });
   }

   transaction.set(sequenceRef, {kotSequence:nextKotSequence}, {merge:true});
   transaction.set(kotRef, {
    code: kotCode,
    kotCode,
    order: finalOrderCode,
    orderId: orderRef.id,
    table: tableName,
    tableName: tableName,
    tableNumber: orderType === 'DINE-IN' ? (tableName.match(/\d+/)?.[0] || '') : '',
    type: orderType,
    requestKind: isAppend ? 'ADD_ON' : 'NEW',
    items: addedMenuLines.map(item => ({
     id:item.id, name:item.name, qty:item.qty, note:item.note, station:item.station || ''
    })),
    status: 'New',
    source: 'online-menu',
    autoPrint: true,
    printStatus: 'pending',
    customerName,
    customerMobile,
    specialNotes: finalNotes,
    time: localTime,
    date: localDate,
    createdAt: serverTimestamp,
    orderRequestId: id
   });

   for (const item of menuSnapshots) transaction.update(item.ref, {sold:fs.increment(item.line.qty)});

   if (tableRef) {
    const existingTable = tableSnapshot?.exists() ? (tableSnapshot.data() || {}) : {};
    transaction.set(tableRef, {
     name: tableName,
     area: existingTable.area || 'Online / QR',
     cap: Number(existingTable.cap || 4),
     status: 'Occupied',
     source: existingTable.source || 'online-menu',
     lastOrderSource: 'online-menu',
     lastOrderCode: finalOrderCode,
     lastOnlineOrderId: orderRef.id,
     activeOrderId: orderRef.id,
     ...(!isAppend ? {onlineOrdersCount: fs.increment(1)} : {}),
     updatedAt: serverTimestamp,
     ...(!tableSnapshot?.exists() ? {createdAt:serverTimestamp} : {})
    }, {merge:true});
   }

   transaction.update(requestRef, {
    status:'accepted',
    orderId:orderRef.id,
    orderCode:finalOrderCode,
    kotId:kotRef.id,
    kotCode,
    subtotal:finalSubtotal,
    acceptedAt:serverTimestamp
   });
   return true;
  });

  if (accepted) toast(`Online order ${orderCode} ${isAppend ? 'updated' : 'received'}${tableRef ? ` • ${tableName}` : ''}`);
 } catch (error) {
  console.error(`Could not process Digital Menu request ${id}:`, error);
  const message = String(error?.message || error).slice(0, 300);
  const isValidation = /choose |customer name|valid 10-digit|table name|order must|order lines|quantity|menu item|selected item|active order|add-on|settled|same order type/i.test(message);
  try {
   if (isValidation) {
    await fs.updateDoc(requestRef, {status:'rejected', message, processedAt:fs.serverTimestamp()});
   } else {
    await fs.updateDoc(requestRef, {lastProcessingError:message, lastAttemptAt:fs.serverTimestamp()});
   }
  } catch (statusError) {
   console.error('Could not update online order request status:', statusError);
  }
 } finally {
  onlineOrderRequestsInFlight.delete(id);
 }
}

function attachListeners(){
 subscribeSnapshot(fs.collection(db,'menu'), snap=>{
   latestMenuSnapshot = snap;
   const seen=new Set();
   const firestoreMenu=snap.docs.map(d=>({id:d.id,...d.data()}));
   state.menu=(firestoreMenu.length?firestoreMenu:SEED.menu.map(item=>({...item}))).filter(m=>{
     const cat=String(m.cat||'Other').trim();
     const name=String(m.name||'').trim().replace(/\s+/g,' ').toLowerCase();
     const key=`${cat.toLowerCase()}::${name}`;
     if(!name || FEELING_HUNGRY_BUILDER_ONLY_CATEGORIES.includes(cat) || seen.has(key)) return false;
     seen.add(key); return true;
   });
   // Keep the public Digital Menu catalogue in sync directly from this POS.
   // The customer page listens to digitalMenu and can unlock Add to Cart as soon
   // as this initial mirror completes.
   if (firebaseSetupComplete && snap.metadata?.fromCache === false) {
     syncPublicMenuFromPOSSnapshot(snap);
   }
   render();
 }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'tables'), snap=>{ state.tables = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'inventory'), snap=>{ state.inventory = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
subscribeSnapshot(fs.query(fs.collection(db,'inventoryLogs'), fs.orderBy('createdAt','desc')), snap=>{ state.inventoryLogs = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>{ state.inventoryLogs=[]; console.warn('Inventory history unavailable',err); });
 subscribeSnapshot(fs.collection(db,'suppliers'), snap=>{ state.suppliers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'purchases'), fs.orderBy('createdAt','desc')), snap=>{ state.purchases = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.collection(db,'staff'), snap=>{ state.staff = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
  subscribeSnapshot(fs.collection(db,'customers'), snap=>{ state.customers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
  subscribeSnapshot(fs.query(fs.collection(db,'expenses'), fs.orderBy('createdAt','desc')), snap=>{ state.expenses = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'orders'), fs.orderBy('createdAt','desc')), snap=>{ state.orders = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err=>connErr(err));
 subscribeSnapshot(fs.query(fs.collection(db,'kots'), fs.orderBy('createdAt','desc')), snap=>{
  state.kots = snap.docs.map(d=>({id:d.id,...d.data()}));
  // Print only explicitly queued Digital Menu KOTs. Each KOT is transactionally
  // claimed once (pending -> printing) and marked printed after the print dialog.
  // Historical/claimed tickets are never automatically printed again.
  schedulePendingOnlineKOTPrints();
  render();
 }, err=>connErr(err));
 // Customer orders are created in onlineOrderRequests by the public Digital Menu.
 // This trusted POS device validates them against the private menu and writes
 // orders, KOTs and table updates to the existing POS collections.
 subscribeSnapshot(fs.collection(db,'onlineOrderRequests'), snap=>{
  latestOnlineOrderRequestsSnapshot = snap;
  if (!firebaseSetupComplete) return;
  snap.docChanges().forEach(change=>{
   const data = change.doc.data() || {};
   if (data.status === 'pending') processOnlineMenuRequest(change.doc.id);
  });
 }, err=>connErr(err));
 subscribeSnapshot(fs.doc(db,'settings','main'), snap=>{
  if(snap.exists()){
   const d=snap.data()||{};
   if(d.printerProfile!=='POS58'){
    // One-time compatibility migration for the supplied POS58 58mm printer driver.
    state.settings={...state.settings,...d,receipt:58,kotWidth:58,printerProfile:'POS58'};
    fs.setDoc(fs.doc(db,'settings','main'),{receipt:58,kotWidth:58,printerProfile:'POS58'},{merge:true})
      .catch(error=>console.warn('Could not save POS58 print defaults:',error));
   }else{
    state.settings={...state.settings,...d};
   }
   state.autoPrintOnlineKots=d.autoPrintOnlineKots!==false;
  }
  schedulePendingOnlineKOTPrints();
  render();
 }, err=>connErr(err));
}
function connErr(err){
 console.error('Firestore listener error', err?.code || '', err?.message || err);
 firebaseListenerError = err || new Error('Unknown Firestore listener error');
 firebaseStatus = 'error';
 firebaseError = describeFirebaseError(firebaseListenerError);
 render();
}

window.addEventListener('offline', () => {
  if (db) {
    firebaseStatus = 'connecting';
    firebaseError = 'This device is offline. Cached data may remain visible; Firestore will resume live sync when internet returns.';
    render();
  }
});
window.addEventListener('online', () => {
  if (db && !firebaseListenerError) {
    firebaseStatus = 'connecting';
    firebaseError = 'Internet restored. Waiting for Firestore to confirm live sync…';
    render();
    // Firestore automatically retries its network connection. Do not recreate
    // every listener on each browser online event.
  }
});

function syncMobileShell(){

async function sendBluetoothBytes(bytes,options={}){

}

async function requestPrinterPermissions(){
 if(!printerSupported()){
  const message=printerUnsupportedMessage();
  const status=document.getElementById('fhPrinterPermissionStatus');if(status)status.textContent=message+' '+printerGuidance();
  toast(message);return false;
 }
 // Bluetooth chooser is invoked directly from this button click. No geolocation
 // prompt is requested: location permission is not part of the Web Bluetooth API.
 await connectBluetoothPrinter();
 const status=document.getElementById('fhPrinterPermissionStatus');
 if(status)status.textContent=(fhBtDevice?.gatt?.connected?'Printer paired and connected. Saved browser authorization will be reused on future visits. ':'Pairing was not completed. ')+printerGuidance();
 return !!(fhBtDevice?.gatt?.connected&&fhBtCharacteristic);
}
async function requestAppPermission(kind){
 try{
  if(kind==='location'){if(!navigator.geolocation)return toast('Location unavailable');navigator.geolocation.getCurrentPosition(()=>toast('Location permission granted'),e=>toast(e.code===1?'Location permission denied':'Could not get location'),{timeout:10000})}
  else if(kind==='notifications'){if(!('Notification'in window))return toast('Notifications unsupported');const result=await Notification.requestPermission();toast(result==='granted'?'Notifications enabled':`Notification permission: ${result}`)}
  else if(kind==='camera'){if(!navigator.mediaDevices?.getUserMedia)return toast('Camera unavailable');const stream=await navigator.mediaDevices.getUserMedia({video:true});stream.getTracks().forEach(t=>t.stop());toast('Camera permission granted')}
 }catch(error){toast(`Permission request failed: ${String(error?.message||error).slice(0,90)}`)}
}

function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function isBuildYourOwnBurger(m){
 return /build\s*(your|ur)?\s*own\s*burger/i.test(String(m?.name||''));
}
function getPizzaVariantInfo(item){
 const name=String(item?.name||'Unnamed Pizza').trim();
 const match=name.match(/\s*[-–—]\s*(R|REGULAR|SMALL|S|M|MEDIUM|L|LARGE)\s*$/i);
 if(!match) return {baseName:name,sizeKey:null};
 const token=match[1].toUpperCase();
 const sizeKey=['R','REGULAR','SMALL','S'].includes(token)?'small':(['M','MEDIUM'].includes(token)?'medium':'large');
 return {baseName:name.replace(/\s*[-–—]\s*(R|REGULAR|SMALL|S|M|MEDIUM|L|LARGE)\s*$/i,'').trim(),sizeKey};
}
function groupPizzaVariants(items){
 const byName=new Map();
 const singles=[];
 for(const item of items){
  const info=getPizzaVariantInfo(item);
  if(!info.sizeKey){singles.push(item);continue;}
  const key=info.baseName.toLocaleLowerCase();
  if(!byName.has(key)) byName.set(key,{name:info.baseName,variants:{}});
  const group=byName.get(key);
  if(!group.variants[info.sizeKey]) group.variants[info.sizeKey]=item;
 }
 return {pizzas:[...byName.values()],singles};
}
function renderPizzaCategoryHtml(search){
 const allPizzas=state.menu.filter(m=>['Pizza','Pizzas'].includes(String(m.cat||'Other').trim()) && !FEELING_HUNGRY_BUILDER_ONLY_CATEGORIES.includes(String(m.cat||'').trim()));
 const grouped=groupPizzaVariants(allPizzas);
 const matchesSearch=(pizza)=>!search||[pizza.name,...Object.values(pizza.variants).flatMap(m=>[m.name,m.cat,m.station])].join(' ').toLowerCase().includes(search);
 const pizzas=grouped.pizzas.filter(matchesSearch);
 const singles=grouped.singles.filter(m=>!search||[m.name,m.cat,m.station].map(v=>String(v||'').toLowerCase()).join(' ').includes(search));
 const showBuilder=!search||'build your own pizza pizza'.includes(search);
 const buildCard=showBuilder?`<div class="build-burger-card"><div class="build-title"><div><h3>🍕 Build Your Own Pizza</h3><div class="build-meta">Choose pizza, size, base and extra toppings</div></div><button class="btn primary" onclick="openBuildPizza()">Build Pizza</button></div></div>`:'';
 if(!pizzas.length&&!singles.length&&!buildCard) return `<div class="empty pos-empty">No menu item found for <b>${esc(state.posSearch||'this search')}</b></div>`;
 const sizeOrder=[{key:'small',label:'Regular'},{key:'medium',label:'Medium'},{key:'large',label:'Large'}];

function addCart(id){
  const key=String(id??'');
  let m=state.menu.find(x=>String(x.id??'')===key);
  // Fallback to the built-in menu if Firestore has not finished syncing yet.
  if(!m) m=SEED.menu.find((x,i)=>String(x.id??'')===key || String(x.name)===key);
  if(!m) return toast('Menu item not found — refresh the POS and try again');
  const cartId=String(m.id??m.name);
  const x=state.cart.find(x=>String(x.id??x.name)===cartId || x.name===m.name);
  if(x) x.qty=Number(x.qty||0)+1;
  else state.cart.push({...m,id:cartId,price:Number(m.price||0),cost:Number(m.cost||0),qty:1,note:''});
  refreshPOSView();
}
function addReorderCart(id){
